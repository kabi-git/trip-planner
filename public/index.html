<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trip Planner — Kabi & Deva</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0c0b;
    --card: #111412;
    --section: #161a15;
    --border: #202520;
    --border2: #2a302a;
    --green: #7fff6a;
    --amber: #f5c842;
    --red: #ff5e5e;
    --blue: #5ec8ff;
    --text: #e8ede8;
    --muted: #5a6358;
    --muted2: #7a8778;
    --font-head: 'Bebas Neue', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --font-body: 'DM Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes shimmer {
    from { background-position: -600px 0; }
    to   { background-position: 600px 0; }
  }

  .fade-in { animation: fadeIn 0.25s ease both; }

  /* ── TOPBAR ── */
  #topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,12,11,0.88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; height: 52px;
  }
  #topbar .logo {
    font-family: var(--font-head); font-size: 22px;
    letter-spacing: 2px; color: var(--text);
    cursor: pointer; user-select: none;
  }
  #topbar .logo span { color: var(--green); }
  #topbar .topbar-right { display: flex; align-items: center; gap: 8px; }

  .edit-badge {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    padding: 5px 10px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--border2); background: transparent;
    color: var(--muted2); transition: all 0.15s; user-select: none;
  }
  body.edit-mode .edit-badge { color: var(--amber); border-color: var(--amber); }
  body.viewer-mode .edit-badge { color: var(--blue); border-color: var(--blue); }

  .icon-btn {
    background: none; border: none; cursor: pointer;
    color: var(--muted2); font-size: 18px; padding: 4px;
    border-radius: 4px; transition: color 0.15s; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { color: var(--text); }

  .back-btn {
    font-family: var(--font-mono); font-size: 12px;
    background: none; border: none; color: var(--muted2);
    cursor: pointer; padding: 5px 0; transition: color 0.15s; letter-spacing: 0.5px;
  }
  .back-btn:hover { color: var(--text); }

  /* ── SESSION TIMEOUT BANNER ── */
  .session-banner {
    background: rgba(245,200,66,0.1); border-bottom: 1px solid rgba(245,200,66,0.3);
    padding: 8px 20px; display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-mono); font-size: 11px; color: var(--amber); gap: 12px;
  }
  .session-banner.hidden { display: none; }
  .session-banner button {
    background: none; border: 1px solid var(--amber); color: var(--amber);
    font-family: var(--font-mono); font-size: 10px; padding: 3px 10px;
    border-radius: 3px; cursor: pointer; white-space: nowrap;
  }

  /* ── MAIN ── */
  #app { padding: 0 0 80px; }

  /* ── HERO HOME ── */
  .hero-home { padding: 48px 24px 28px; max-width: 900px; margin: 0 auto; }
  .hero-label {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px;
  }
  .hero-home h1 {
    font-family: var(--font-head); font-size: clamp(42px, 8vw, 72px);
    letter-spacing: 3px; line-height: 1; margin-bottom: 10px; color: var(--text);
  }
  .hero-home h1 span { color: var(--green); }
  .hero-sub {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--muted); letter-spacing: 2px; text-transform: uppercase;
  }

  /* ── SEARCH + FILTER BAR ── */
  .home-controls {
    max-width: 900px; margin: 0 auto 20px; padding: 0 24px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .search-row { display: flex; gap: 8px; align-items: center; }
  .search-input {
    flex: 1; background: var(--card); border: 1px solid var(--border2);
    border-radius: 6px; color: var(--text); font-family: var(--font-body);
    font-size: 13px; padding: 9px 12px; outline: none; transition: border-color 0.15s;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--green); }
  .sort-select {
    background: var(--card); border: 1px solid var(--border2); border-radius: 6px;
    color: var(--muted2); font-family: var(--font-mono); font-size: 11px;
    padding: 9px 10px; outline: none; cursor: pointer; transition: border-color 0.15s;
    appearance: none; min-width: 100px;
  }
  .sort-select:focus { border-color: var(--green); color: var(--text); }
  .sort-select option { background: var(--card); }
  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filter-label { font-family: var(--font-mono); font-size: 10px; color: var(--muted); letter-spacing: 1px; }
  .filter-chip {
    font-family: var(--font-mono); font-size: 10px; padding: 4px 10px;
    border-radius: 4px; cursor: pointer; border: 1px solid var(--border2);
    background: transparent; color: var(--muted2); transition: all 0.15s; user-select: none;
  }
  .filter-chip:hover { border-color: var(--muted2); color: var(--text); }
  .filter-chip.active { background: rgba(127,255,106,0.1); border-color: var(--green); color: var(--green); }

  /* ── CONFIRMED BANNER ── */
  .confirmed-banner { max-width: 900px; margin: 0 auto 24px; padding: 0 24px; }
  .confirmed-banner-inner {
    background: rgba(127,255,106,0.07); border: 1px solid rgba(127,255,106,0.25);
    border-radius: 10px; padding: 18px 22px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .confirmed-banner-emoji { font-size: 32px; }
  .confirmed-banner-info { flex: 1; min-width: 160px; }
  .confirmed-banner-title {
    font-family: var(--font-head); font-size: 20px;
    color: var(--green); letter-spacing: 1.5px; margin-bottom: 3px;
  }
  .confirmed-banner-sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted2); }
  .btn-open {
    font-family: var(--font-mono); font-size: 11px;
    background: var(--green); color: #000; border: none;
    padding: 8px 16px; border-radius: 4px; cursor: pointer;
    font-weight: 600; letter-spacing: 1px; white-space: nowrap; transition: opacity 0.15s;
  }
  .btn-open:hover { opacity: 0.85; }

  /* ── DESTINATION GRID ── */
  .dest-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px; max-width: 900px; margin: 0 auto; padding: 0 24px;
  }
  .dest-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 22px; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    position: relative;
  }
  .dest-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .dest-card.confirmed-glow {
    border-color: rgba(127,255,106,0.35);
    box-shadow: 0 0 20px rgba(127,255,106,0.08), 0 0 1px rgba(127,255,106,0.4);
  }
  .dest-card.confirmed-glow:hover {
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(127,255,106,0.12);
  }
  .dest-card-emoji { font-size: 36px; margin-bottom: 10px; display: block; }
  .dest-card-name {
    font-family: var(--font-head); font-size: 30px;
    letter-spacing: 1.5px; color: var(--text); margin-bottom: 4px; line-height: 1;
  }
  .dest-card-sub { font-size: 13px; color: var(--muted2); margin-bottom: 12px; font-weight: 300; }
  .stat-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .stat-pill {
    font-family: var(--font-mono); font-size: 10px;
    background: var(--section); border: 1px solid var(--border2);
    border-radius: 3px; padding: 3px 8px; color: var(--muted2); white-space: nowrap;
  }
  .tag-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .tag-chip {
    font-family: var(--font-mono); font-size: 9px;
    padding: 3px 7px; border-radius: 3px; letter-spacing: 0.5px; text-transform: uppercase;
  }
  .tag-chip-default { background: rgba(90,99,88,0.2); color: var(--muted2); border: 1px solid var(--border2); }
  .tag-chip-confirmed { background: rgba(127,255,106,0.1); color: var(--green); border: 1px solid rgba(127,255,106,0.3); }

  .add-dest-card {
    background: transparent; border: 1.5px dashed var(--border2); border-radius: 12px;
    padding: 22px; cursor: pointer; display: none;
    align-items: center; justify-content: center; min-height: 140px;
    font-family: var(--font-mono); font-size: 12px; color: var(--muted);
    gap: 8px; transition: border-color 0.15s, color 0.15s;
  }
  body.edit-mode .add-dest-card { display: flex; }
  .add-dest-card:hover { border-color: var(--muted2); color: var(--muted2); }

  /* ── EMPTY STATE ── */
  .empty-state {
    max-width: 900px; margin: 60px auto; padding: 0 24px; text-align: center;
  }
  .empty-state-icon { font-size: 56px; margin-bottom: 16px; }
  .empty-state-title {
    font-family: var(--font-head); font-size: 28px;
    letter-spacing: 2px; color: var(--muted2); margin-bottom: 8px;
  }
  .empty-state-sub { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

  /* ── DEST DETAIL ── */
  .dest-hero { padding: 36px 24px 24px; max-width: 780px; margin: 0 auto; }
  .dest-hero-emoji { font-size: 52px; display: block; margin-bottom: 10px; }
  .dest-hero h1 {
    font-family: var(--font-head); font-size: clamp(36px, 7vw, 60px);
    letter-spacing: 2px; line-height: 1; margin-bottom: 6px;
  }
  .dest-hero-sub { font-size: 14px; color: var(--muted2); margin-bottom: 12px; font-weight: 300; }
  .dest-hero-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .map-link {
    font-family: var(--font-mono); font-size: 11px; color: var(--blue);
    text-decoration: none; border: 1px solid rgba(94,200,255,0.3);
    background: rgba(94,200,255,0.07); padding: 6px 12px; border-radius: 4px;
    transition: background 0.15s; letter-spacing: 0.5px;
  }
  .map-link:hover { background: rgba(94,200,255,0.12); }

  /* ── NOTES BLOCK ── */
  .notes-block {
    max-width: 780px; margin: 0 auto 16px; padding: 0 24px;
  }
  .notes-inner {
    background: rgba(94,200,255,0.04); border: 1px solid rgba(94,200,255,0.15);
    border-radius: 8px; padding: 14px 16px;
  }
  .notes-label {
    font-family: var(--font-mono); font-size: 10px; color: var(--blue);
    letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px;
  }
  .notes-text {
    font-size: 13px; color: var(--muted2); line-height: 1.6; white-space: pre-wrap;
  }

  /* ── PROGRESS BAR ── */
  .progress-bar-wrap {
    max-width: 780px; margin: 0 auto 20px; padding: 0 24px;
  }
  .progress-bar-label {
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;
  }
  .progress-pct { color: var(--green); font-weight: 500; }
  .progress-bar-track {
    height: 5px; background: var(--border2); border-radius: 3px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; background: var(--green); border-radius: 3px; transition: width 0.3s ease;
  }

  /* ── SECTION TABS ── */
  .section-tabs {
    max-width: 780px; margin: 0 auto 12px; padding: 0 24px;
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  }
  .section-tabs::-webkit-scrollbar { display: none; }
  .section-tab {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.5px;
    padding: 5px 12px; border-radius: 4px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--border2); background: transparent;
    color: var(--muted2); transition: all 0.15s; user-select: none; flex-shrink: 0;
  }
  .section-tab:hover { border-color: var(--muted2); color: var(--text); }
  .section-tab.active { background: rgba(127,255,106,0.1); border-color: var(--green); color: var(--green); }

  /* ── SECTIONS ── */
  .sections-list {
    max-width: 780px; margin: 0 auto; padding: 0 24px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .section-block {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }
  .section-block.drag-over { border-color: var(--green); box-shadow: 0 0 8px rgba(127,255,106,0.15); }
  .section-block.dragging { opacity: 0.5; }

  .section-header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; cursor: pointer; user-select: none;
    border-bottom: 1px solid transparent; transition: border-color 0.15s;
  }
  .section-header.open { border-bottom-color: var(--border); }
  .drag-handle {
    display: none; cursor: grab; color: var(--muted); font-size: 14px;
    padding: 0 2px; flex-shrink: 0; line-height: 1;
  }
  .drag-handle:active { cursor: grabbing; }
  body.edit-mode .drag-handle { display: flex; align-items: center; }

  .section-icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
  .section-title {
    font-family: var(--font-mono); font-size: 12px; font-weight: 500;
    letter-spacing: 1px; text-transform: uppercase; color: var(--text); flex: 1;
  }
  .section-count { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
  .section-edit-btns { display: none; gap: 4px; align-items: center; }
  body.edit-mode .section-edit-btns { display: flex; }
  .section-chevron {
    color: var(--muted); font-size: 12px; transition: transform 0.25s; margin-left: 4px;
  }
  .section-chevron.open { transform: rotate(180deg); }

  /* Smooth expand via grid rows */
  .section-body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.25s ease;
  }
  .section-body.open { grid-template-rows: 1fr; }
  .section-body-inner { overflow: hidden; }

  /* ── BULK CHECK ── */
  .bulk-check-bar {
    display: none; gap: 8px; padding: 6px 16px 2px;
    align-items: center; border-bottom: 1px dashed var(--border);
  }
  .section-body.open .bulk-check-bar { display: flex; }
  .bulk-btn {
    font-family: var(--font-mono); font-size: 10px; background: none;
    border: 1px solid var(--border2); color: var(--muted2);
    padding: 3px 10px; border-radius: 3px; cursor: pointer; transition: all 0.15s;
  }
  .bulk-btn:hover { border-color: var(--green); color: var(--green); }

  /* ── ITEMS ── */
  .item-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 16px; position: relative; transition: background 0.1s;
  }
  body.compact-mode .item-row { padding: 6px 16px; }
  .item-row:hover { background: rgba(255,255,255,0.02); }
  .item-row.drag-over-item { border-top: 2px solid var(--green); }
  .item-drag-handle {
    display: none; cursor: grab; color: var(--muted); font-size: 13px;
    flex-shrink: 0; margin-top: 2px; line-height: 1;
  }
  body.edit-mode .item-drag-handle { display: flex; align-items: center; }

  .item-icon {
    width: 22px; flex-shrink: 0; margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
  }
  .item-checkbox {
    width: 18px; height: 18px; border: 1.5px solid var(--border2);
    border-radius: 3px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s; background: transparent;
  }
  .item-checkbox.done { background: var(--green); border-color: var(--green); }
  .item-checkbox.done::after {
    content: ''; width: 5px; height: 9px;
    border: 2px solid #000; border-left: none; border-top: none;
    transform: rotate(45deg) translateY(-1px);
  }
  .never-x { color: var(--red); font-size: 14px; font-weight: bold; line-height: 1; margin-top: 2px; }
  .route-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 5px;
  }
  .route-dot.green { background: var(--green); }
  .route-dot.amber { background: var(--amber); }
  .route-dot.red   { background: var(--red); }
  .route-dot.blue  { background: var(--blue); }
  .route-dot.empty { background: var(--muted); }
  .info-icon { color: var(--blue); font-size: 14px; margin-top: 2px; }

  .item-content { flex: 1; min-width: 0; }
  .item-text { font-size: 13.5px; color: var(--text); line-height: 1.4; font-weight: 400; }
  body.compact-mode .item-text { font-size: 12.5px; }
  .item-row.never .item-text { color: var(--red); }
  .item-row.done .item-text  { color: var(--muted); text-decoration: line-through; }
  .item-note {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--muted); margin-top: 3px; line-height: 1.5;
  }
  .itag {
    display: inline-block; font-family: var(--font-mono); font-size: 9px;
    padding: 2px 6px; border-radius: 3px; margin-left: 6px;
    vertical-align: middle; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .itag-red   { background: rgba(255,94,94,0.12);  color: var(--red);   border: 1px solid rgba(255,94,94,0.25); }
  .itag-amber { background: rgba(245,200,66,0.12); color: var(--amber); border: 1px solid rgba(245,200,66,0.25); }
  .itag-green { background: rgba(127,255,106,0.1); color: var(--green); border: 1px solid rgba(127,255,106,0.2); }
  .itag-blue  { background: rgba(94,200,255,0.1);  color: var(--blue);  border: 1px solid rgba(94,200,255,0.2); }

  .item-edit-btns {
    display: none; gap: 4px; align-items: center; flex-shrink: 0; margin-top: 1px;
  }
  body.edit-mode .item-edit-btns { display: flex; }

  .add-item-btn {
    display: none; width: 100%; background: none; border: none;
    border-top: 1px dashed var(--border); color: var(--muted);
    font-family: var(--font-mono); font-size: 11px; padding: 10px 16px;
    cursor: pointer; text-align: left; gap: 6px; transition: color 0.15s;
  }
  body.edit-mode .add-item-btn { display: flex; }
  .add-item-btn:hover { color: var(--muted2); }

  .add-section-btn {
    display: none; background: transparent; border: 1.5px dashed var(--border2);
    border-radius: 10px; padding: 14px; cursor: pointer; color: var(--muted);
    font-family: var(--font-mono); font-size: 11px; gap: 6px;
    align-items: center; justify-content: center; transition: border-color 0.15s, color 0.15s;
  }
  body.edit-mode .add-section-btn { display: flex; }
  .add-section-btn:hover { border-color: var(--muted2); color: var(--muted2); }

  /* ── DENSITY TOGGLE ── */
  .density-btn {
    font-family: var(--font-mono); font-size: 11px; background: none;
    border: 1px solid var(--border2); color: var(--muted2);
    padding: 5px 10px; border-radius: 4px; cursor: pointer; transition: all 0.15s;
  }
  .density-btn:hover { border-color: var(--muted2); color: var(--text); }

  /* ── CONFIRM FOOTER ── */
  .confirm-footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 12px 20px;
    background: rgba(10,12,11,0.92); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border); z-index: 90;
  }
  .confirm-btn {
    width: 100%; max-width: 480px; display: block; margin: 0 auto;
    background: var(--green); color: #000; border: none; border-radius: 6px;
    padding: 13px 20px; font-family: var(--font-head); font-size: 18px;
    letter-spacing: 2px; cursor: pointer; transition: opacity 0.15s;
  }
  .confirm-btn:hover { opacity: 0.85; }
  .confirmed-static {
    font-family: var(--font-head); font-size: 18px; letter-spacing: 2px;
    color: var(--muted); padding: 13px 0; flex: 1; text-align: center;
  }
  .confirmed-footer-row {
    display: flex; align-items: center; max-width: 480px; margin: 0 auto; gap: 10px;
  }
  .unconfirm-btn {
    flex-shrink: 0; background: none; border: 1px solid var(--border2);
    color: var(--muted2); font-family: var(--font-mono); font-size: 11px;
    padding: 8px 12px; border-radius: 5px; cursor: pointer;
    letter-spacing: 0.5px; transition: border-color 0.15s, color 0.15s; white-space: nowrap;
  }
  .unconfirm-btn:hover { border-color: var(--red); color: var(--red); }

  /* ── MODALS ── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal {
    background: var(--card); border: 1px solid var(--border2);
    border-radius: 12px; padding: 24px; width: 100%;
    max-width: 440px; max-height: 90vh; overflow-y: auto; position: relative;
  }
  .modal h3 {
    font-family: var(--font-head); font-size: 22px;
    letter-spacing: 1px; margin-bottom: 18px; color: var(--text);
  }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block; font-family: var(--font-mono); font-size: 10px;
    color: var(--muted2); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px;
  }
  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%; background: var(--section); border: 1px solid var(--border2);
    border-radius: 5px; color: var(--text); font-family: var(--font-body);
    font-size: 14px; padding: 9px 11px; outline: none;
    transition: border-color 0.15s; appearance: none;
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus { border-color: var(--green); }
  .form-group input.error { border-color: var(--red); }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-group select option { background: var(--card); }
  .modal-btns {
    display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end;
  }
  .btn-cancel {
    background: none; border: 1px solid var(--border2); color: var(--muted2);
    font-family: var(--font-mono); font-size: 12px; padding: 8px 16px;
    border-radius: 5px; cursor: pointer; transition: border-color 0.15s;
  }
  .btn-cancel:hover { border-color: var(--muted2); }
  .btn-save {
    background: var(--green); border: none; color: #000;
    font-family: var(--font-mono); font-size: 12px; font-weight: 600;
    padding: 8px 18px; border-radius: 5px; cursor: pointer; transition: opacity 0.15s;
  }
  .btn-save:hover { opacity: 0.85; }
  .btn-danger {
    background: none; border: 1px solid rgba(255,94,94,0.4); color: var(--red);
    font-family: var(--font-mono); font-size: 12px; padding: 8px 16px;
    border-radius: 5px; cursor: pointer; transition: background 0.15s;
  }
  .btn-danger:hover { background: rgba(255,94,94,0.1); }

  /* ── TOAST ── */
  #toast-container {
    position: fixed; bottom: 70px; left: 50%;
    transform: translateX(-50%); z-index: 999;
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none;
  }
  .toast {
    font-family: var(--font-mono); font-size: 12px;
    padding: 9px 18px; border-radius: 5px;
    animation: slideUp 0.2s ease both; white-space: nowrap; pointer-events: auto;
  }
  .toast.success { background: rgba(127,255,106,0.15); border: 1px solid rgba(127,255,106,0.3); color: var(--green); }
  .toast.error   { background: rgba(255,94,94,0.15);  border: 1px solid rgba(255,94,94,0.3);  color: var(--red); }
  .toast.info    { background: rgba(94,200,255,0.12); border: 1px solid rgba(94,200,255,0.25); color: var(--blue); }

  /* ── SCROLL TO TOP ── */
  .scroll-top-btn {
    position: fixed; bottom: 72px; right: 20px; z-index: 80;
    background: var(--card); border: 1px solid var(--border2); color: var(--muted2);
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s, transform 0.2s, color 0.15s;
    opacity: 0; pointer-events: none; transform: translateY(8px);
  }
  .scroll-top-btn.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .scroll-top-btn:hover { color: var(--text); border-color: var(--muted2); }

  /* ── SKELETON ── */
  .skeleton {
    background: linear-gradient(90deg, var(--card) 25%, var(--section) 50%, var(--card) 75%);
    background-size: 600px 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    border-radius: 4px;
  }
  .skel-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 10px;
  }
  .skel-line { height: 12px; border-radius: 3px; }
  .skel-title { height: 28px; width: 70%; border-radius: 4px; }
  .skel-sub   { height: 10px; width: 50%; border-radius: 3px; }

  /* ── PRINT STYLES ── */
  @media print {
    #topbar, .confirm-footer, .section-edit-btns, .item-edit-btns,
    .add-item-btn, .add-section-btn, .add-dest-card, #toast-container,
    .scroll-top-btn, .session-banner, .home-controls, .section-tabs,
    .dest-hero-actions .density-btn, .drag-handle, .item-drag-handle,
    .bulk-check-bar { display: none !important; }
    body { background: #fff; color: #000; }
    .dest-hero h1, .dest-card-name { color: #000; }
    .dest-card, .section-block { border: 1px solid #ccc; break-inside: avoid; }
    .section-body { grid-template-rows: 1fr !important; }
    .item-text { color: #000; }
    .item-note { color: #555; }
    .never-x { color: #c00; }
    #app { padding: 0; }
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<div id="topbar">
  <div id="topbar-left"></div>
  <div class="topbar-right">
    <div id="topbar-dest-btns" style="display:none; gap:8px; align-items:center;"></div>
    <button class="edit-badge" id="edit-badge" onclick="handleEditBadge()">🔒 EDIT</button>
  </div>
</div>

<div id="session-banner" class="session-banner hidden">
  <span id="session-banner-msg">⏱ Session expiring soon</span>
  <button onclick="extendSession()">KEEP ME IN</button>
</div>

<div id="app"></div>
<button class="scroll-top-btn" id="scroll-top-btn" onclick="scrollToTop()" title="Back to top">↑</button>
<div id="toast-container"></div>

<script>
// ===================== STATE =====================
let token      = localStorage.getItem('auth_token') || null;
let userRole   = localStorage.getItem('user_role')  || null;
let editMode   = false;
let currentView   = 'home';
let currentDestId = null;
let destinations  = [];
let currentDest   = null;
let checkState    = JSON.parse(localStorage.getItem('check_state') || '{}');
let deviceId      = localStorage.getItem('device_id');
if (!deviceId) { deviceId = crypto.randomUUID(); localStorage.setItem('device_id', deviceId); }
let searchQuery = '';
let filterTag   = '';
let sortBy      = 'default';
let densityMode = localStorage.getItem('density_mode') || 'comfortable';
let pollTimer   = null;
let sessionTimer     = null;
let sessionWarnTimer = null;
const SESSION_MS = 30 * 60 * 1000; // 30 min
const WARN_MS    = 25 * 60 * 1000; // warn at 25 min

if (densityMode === 'compact') document.body.classList.add('compact-mode');

// ===================== API =====================
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res  = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ===================== AUTH =====================
async function checkAuth() {
  if (!token) return;
  try {
    const r = await api('GET', '/api/auth/check');
    if (!r.authenticated) { clearSession(); }
    else { userRole = r.role; localStorage.setItem('user_role', userRole); applyRoleBadge(); }
  } catch { clearSession(); }
}

async function login(password) {
  const data = await api('POST', '/api/auth/login', { password });
  token    = data.token;
  userRole = data.role;
  localStorage.setItem('auth_token', token);
  localStorage.setItem('user_role', userRole);
  startSessionTimer();
  applyRoleBadge();
}

async function logout() {
  try { await api('POST', '/api/auth/logout'); } catch {}
  clearSession();
}

function clearSession() {
  token = null; userRole = null; editMode = false;
  localStorage.removeItem('auth_token');
  localStorage.removeItem('user_role');
  document.body.classList.remove('edit-mode', 'viewer-mode');
  clearTimeout(sessionTimer);
  clearTimeout(sessionWarnTimer);
  document.getElementById('session-banner').classList.add('hidden');
  updateEditBadge();
}

function applyRoleBadge() {
  if (userRole === 'viewer') document.body.classList.add('viewer-mode');
  else document.body.classList.remove('viewer-mode');
}

// ===================== SESSION TIMEOUT =====================
function startSessionTimer() {
  clearTimeout(sessionTimer);
  clearTimeout(sessionWarnTimer);
  sessionWarnTimer = setTimeout(() => {
    const banner = document.getElementById('session-banner');
    document.getElementById('session-banner-msg').textContent = '⏱ Session expires in 5 minutes — save anything you need';
    banner.classList.remove('hidden');
  }, WARN_MS);
  sessionTimer = setTimeout(async () => {
    await logout();
    render();
    toast('Session expired — logged out', 'info');
  }, SESSION_MS);
}

function extendSession() {
  if (!token) return;
  startSessionTimer();
  document.getElementById('session-banner').classList.add('hidden');
  toast('Session extended', 'success');
}

// ===================== EDIT BADGE =====================
function updateEditBadge() {
  const badge = document.getElementById('edit-badge');
  if (!badge) return;
  if (editMode)              badge.textContent = '✏️ EDIT ON';
  else if (userRole === 'viewer') badge.textContent = '👁 VIEW MODE';
  else                       badge.textContent = '🔒 EDIT';
}

async function handleEditBadge() {
  if (editMode) {
    await logout();
    render();
    return;
  }
  if (userRole === 'viewer') {
    await logout();
    render();
    return;
  }
  if (token && userRole === 'admin') {
    editMode = true;
    document.body.classList.add('edit-mode');
    updateEditBadge();
    render();
    return;
  }
  showPasswordModal((role) => {
    if (role === 'admin') {
      editMode = true;
      document.body.classList.add('edit-mode');
    }
    updateEditBadge();
    render();
  });
}

// ===================== TOAST =====================
function toast(msg, type = 'success') {
  const c  = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

// ===================== SCROLL TO TOP =====================
window.addEventListener('scroll', () => {
  const btn = document.getElementById('scroll-top-btn');
  if (btn) btn.classList.toggle('visible', window.scrollY > 300);
});
function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

// ===================== SKELETON =====================
function showSkeleton(containerId, count = 3) {
  const cards = Array.from({ length: count }, () => `
    <div class="skel-card">
      <div class="skeleton skel-title"></div>
      <div class="skeleton skel-sub"></div>
      <div class="skeleton skel-line" style="width:60%"></div>
    </div>`).join('');
  document.getElementById(containerId).innerHTML = `<div class="dest-grid fade-in">${cards}</div>`;
}

// ===================== RENDER =====================
function render() {
  updateEditBadge();
  if (currentView === 'home') renderHome();
  else renderDestView();
}

// ===================== HOME =====================
async function renderHome() {
  currentView   = 'home';
  currentDestId = null;
  currentDest   = null;
  stopPoll();

  document.getElementById('topbar-left').innerHTML =
    `<div class="logo" onclick="goHome()">TRIP <span>PLANNER</span></div>`;
  document.getElementById('topbar-dest-btns').style.display = 'none';

  document.getElementById('app').innerHTML = `<div id="home-skeleton"></div>`;
  showSkeleton('home-skeleton', 3);

  try {
    const params = new URLSearchParams();
    if (searchQuery) params.set('q', searchQuery);
    if (sortBy !== 'default') params.set('sort', sortBy);
    destinations = await api('GET', '/api/destinations' + (params.toString() ? '?' + params : ''));
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">COULD NOT LOAD</div><div class="empty-state-sub">${esc(e.message)}</div></div>`;
    return;
  }

  const confirmed = destinations.find(d => d.confirmed);

  // Collect all unique tags for filter chips
  const allTags = [...new Set(destinations.flatMap(d => d.tags || []))].sort();

  // Client-side tag filter
  let filtered = filterTag
    ? destinations.filter(d => (d.tags || []).includes(filterTag))
    : destinations;

  let html = `<div class="fade-in">
    <div class="hero-home">
      <div class="hero-label">Anniversary · July 5th · 2025</div>
      <h1>WHERE ARE WE <span>GOING?</span></h1>
      <div class="hero-sub">KABI & DEVA · PICK THE ADVENTURE</div>
    </div>

    <div class="home-controls">
      <div class="search-row">
        <input class="search-input" id="search-input" placeholder="🔍  Search destinations…"
          value="${esc(searchQuery)}" oninput="onSearchInput(this.value)" />
        <select class="sort-select" onchange="onSortChange(this.value)">
          <option value="default" ${sortBy==='default'?'selected':''}>Default</option>
          <option value="name"     ${sortBy==='name'?'selected':''}>A–Z</option>
          <option value="distance" ${sortBy==='distance'?'selected':''}>Closest</option>
          <option value="duration" ${sortBy==='duration'?'selected':''}>Shortest</option>
        </select>
      </div>`;

  if (allTags.length > 0) {
    html += `<div class="filter-chips">
      <span class="filter-label">FILTER:</span>
      <span class="filter-chip ${!filterTag?'active':''}" onclick="setFilter('')">ALL</span>`;
    for (const t of allTags) {
      html += `<span class="filter-chip ${filterTag===t?'active':''}" onclick="setFilter('${esc(t)}')">${esc(t)}</span>`;
    }
    html += `</div>`;
  }
  html += `</div>`;

  if (confirmed) {
    html += `<div class="confirmed-banner">
      <div class="confirmed-banner-inner">
        <div class="confirmed-banner-emoji">${confirmed.emoji || '🏍️'}</div>
        <div class="confirmed-banner-info">
          <div class="confirmed-banner-title">WE'RE GOING TO ${esc(confirmed.name.toUpperCase())} 🏍️❤️</div>
          <div class="confirmed-banner-sub">${esc(confirmed.subtitle || '')} · ${confirmed.distance_km} km · ${esc(confirmed.duration_hrs || '')}</div>
        </div>
        <button class="btn-open" onclick="openDest(${confirmed.id})">OPEN PLAN →</button>
      </div>
    </div>`;
  }

  if (filtered.length === 0 && !searchQuery && !filterTag) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">🗺️</div>
      <div class="empty-state-title">NO DESTINATIONS YET</div>
      <div class="empty-state-sub">Enable edit mode and add your first destination</div>
    </div>`;
  } else if (filtered.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">🔍</div>
      <div class="empty-state-title">NO RESULTS</div>
      <div class="empty-state-sub">Try a different search or filter</div>
    </div>`;
  } else {
    html += `<div class="dest-grid">`;
    for (const d of filtered) html += renderDestCard(d);
    html += `<div class="add-dest-card" onclick="showAddDestModal()">＋ ADD DESTINATION</div>`;
    html += `</div>`;
  }

  html += `</div>`;
  document.getElementById('app').innerHTML = html;

  // Re-focus search after re-render
  if (searchQuery) {
    const inp = document.getElementById('search-input');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
}

let searchDebounce = null;
function onSearchInput(val) {
  clearTimeout(searchDebounce);
  searchQuery = val;
  searchDebounce = setTimeout(() => renderHome(), 280);
}
function onSortChange(val) { sortBy = val; renderHome(); }
function setFilter(tag) { filterTag = tag; renderHome(); }

function renderDestCard(d) {
  const tags = (d.tags || []).map(t =>
    `<span class="tag-chip tag-chip-default">${esc(t)}</span>`).join('');
  const confirmedChip = d.confirmed ? `<span class="tag-chip tag-chip-confirmed">✓ CONFIRMED</span>` : '';
  const glowClass = d.confirmed ? ' confirmed-glow' : '';
  return `<div class="dest-card${glowClass}" onclick="openDest(${d.id})">
    <span class="dest-card-emoji">${d.emoji || '📍'}</span>
    <div class="dest-card-name">${esc(d.name)}</div>
    <div class="dest-card-sub">${esc(d.subtitle || '')}</div>
    <div class="stat-pills">
      <span class="stat-pill">📍 ${d.distance_km || '?'} km</span>
      <span class="stat-pill">⏱ ${esc(d.duration_hrs || '?')}</span>
    </div>
    <div class="tag-chips">${tags}${confirmedChip}</div>
  </div>`;
}

// ===================== DEST DETAIL =====================
async function openDest(id) {
  currentView   = 'dest';
  currentDestId = id;

  // Show skeleton while loading
  document.getElementById('topbar-left').innerHTML =
    `<button class="back-btn" onclick="goHome()">← ALL DESTINATIONS</button>`;
  document.getElementById('topbar-dest-btns').style.display = 'none';
  document.getElementById('app').innerHTML = `<div class="sections-list fade-in" style="margin-top:40px">
    ${[1,2,3].map(() => `<div class="skel-card"><div class="skeleton skel-title"></div><div class="skeleton skel-sub"></div></div>`).join('')}
  </div>`;

  try {
    currentDest = await api('GET', '/api/destinations/' + id);
    // Merge server checklist state
    await syncChecklistFromServer();
  } catch (e) {
    toast(e.message, 'error');
    return;
  }
  renderDestView();
  startPoll();
}

async function syncChecklistFromServer() {
  if (!currentDestId) return;
  try {
    const serverState = await api('GET', `/api/checklist/${currentDestId}?device_id=${deviceId}`);
    // Merge: server wins (enables cross-device sync)
    Object.assign(checkState, serverState);
    localStorage.setItem('check_state', JSON.stringify(checkState));
  } catch {}
}

function startPoll() {
  stopPoll();
  pollTimer = setInterval(async () => {
    if (currentView !== 'dest' || !currentDestId) { stopPoll(); return; }
    await syncChecklistFromServer();
    updateProgressBar();
    // Refresh section counts
    for (const s of (currentDest?.sections || [])) {
      const countEl = document.getElementById('section-count-' + s.id);
      if (countEl) {
        const checkItems = (s.items || []).filter(i => i.item_type === 'check');
        const done = checkItems.filter(i => checkState[i.id]).length;
        countEl.textContent = checkItems.length > 0 ? `${done}/${checkItems.length}` : `${s.items.length}`;
      }
    }
  }, 30000);
}

function stopPoll() {
  clearInterval(pollTimer);
  pollTimer = null;
}

function renderDestView() {
  const d = currentDest;

  document.getElementById('topbar-left').innerHTML =
    `<button class="back-btn" onclick="goHome()">← ALL DESTINATIONS</button>`;

  const destBtns = document.getElementById('topbar-dest-btns');
  destBtns.style.display = 'flex';
  destBtns.innerHTML = `
    <button class="density-btn" onclick="toggleDensity()" title="Toggle density">${densityMode === 'compact' ? '⊟ COMPACT' : '⊞ COMFORTABLE'}</button>
    <button class="icon-btn" title="Export / Print" onclick="exportToPDF()">🖨️</button>
    <button class="icon-btn" title="Share trip" onclick="shareTrip()">📤</button>
    ${editMode ? `<button class="icon-btn" title="Clone destination" onclick="cloneDestination()">⎘</button>
    <button class="icon-btn" title="Edit destination" onclick="showEditDestModal()">✏️</button>
    <button class="icon-btn" title="Delete destination" onclick="deleteDestination()">🗑</button>` : ''}
  `;

  const allCheckItems = (d.sections || []).flatMap(s =>
    (s.items || []).filter(i => i.item_type === 'check'));
  const totalCheck = allCheckItems.length;
  const doneCheck  = allCheckItems.filter(i => checkState[i.id]).length;
  const pct = totalCheck > 0 ? Math.round((doneCheck / totalCheck) * 100) : 0;

  const mapQuery = encodeURIComponent((d.name || '') + ' India');

  let html = `<div class="fade-in">
    <div class="dest-hero">
      <span class="dest-hero-emoji">${d.emoji || '📍'}</span>
      <h1>${esc(d.name)}</h1>
      <div class="dest-hero-sub">${esc(d.subtitle || '')}</div>
      <div class="stat-pills">
        <span class="stat-pill">📍 ${d.distance_km || '?'} km</span>
        <span class="stat-pill">⏱ ${esc(d.duration_hrs || '?')}</span>
      </div>
      <div class="tag-chips">
        ${(d.tags || []).map(t => `<span class="tag-chip tag-chip-default">${esc(t)}</span>`).join('')}
      </div>
      <div class="dest-hero-actions">
        <a class="map-link" href="https://maps.google.com/?q=${mapQuery}" target="_blank" rel="noopener">🗺 VIEW ON MAP</a>
      </div>
    </div>`;

  if (d.notes) {
    html += `<div class="notes-block">
      <div class="notes-inner">
        <div class="notes-label">📝 Notes</div>
        <div class="notes-text">${esc(d.notes)}</div>
      </div>
    </div>`;
  }

  if (totalCheck > 0) {
    html += `<div class="progress-bar-wrap">
      <div class="progress-bar-label">
        <span>CHECKLIST PROGRESS</span>
        <span>${doneCheck} / ${totalCheck} <span class="progress-pct">${pct}%</span></span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill" style="width:${pct}%"></div>
      </div>
    </div>`;
  }

  // Section tabs
  if ((d.sections || []).length > 1) {
    html += `<div class="section-tabs">`;
    for (const s of d.sections) {
      html += `<button class="section-tab" onclick="jumpToSection(${s.id})">${s.icon || ''}  ${esc(s.title)}</button>`;
    }
    html += `</div>`;
  }

  html += `<div class="sections-list" id="sections-list">`;
  for (const section of d.sections || []) html += renderSection(section);
  html += `<button class="add-section-btn" onclick="showAddSectionModal()">＋ ADD SECTION</button>`;
  html += `</div></div>`;

  // Confirm footer
  html += `<div class="confirm-footer">`;
  if (d.confirmed) {
    html += `<div class="confirmed-footer-row">
      <div class="confirmed-static">✓ THIS IS THE ONE</div>
      <button class="unconfirm-btn" onclick="unconfirmTrip()">↩ UNDO</button>
    </div>`;
  } else {
    html += `<button class="confirm-btn" onclick="confirmTrip()">WE'RE GOING TO ${esc(d.name.toUpperCase())} 🏍️❤️</button>`;
  }
  html += `</div>`;

  document.getElementById('app').innerHTML = html;

  if (editMode) initSectionDrag();
}

function jumpToSection(id) {
  // Expand the section and scroll to it
  const block = document.getElementById('section-' + id);
  if (!block) return;
  const body = document.getElementById('section-body-' + id);
  const header = block.querySelector('.section-header');
  if (body && !body.classList.contains('open')) {
    body.classList.add('open');
    header && header.classList.add('open');
    const chevron = header && header.querySelector('.section-chevron');
    if (chevron) chevron.classList.add('open');
  }
  block.scrollIntoView({ behavior: 'smooth', block: 'start' });
  // Highlight active tab
  document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
  const tabs = document.querySelectorAll('.section-tab');
  const sections = currentDest?.sections || [];
  const idx = sections.findIndex(s => s.id === id);
  if (tabs[idx]) tabs[idx].classList.add('active');
}

function renderSection(section) {
  const items = section.items || [];
  const checkItems = items.filter(i => i.item_type === 'check');
  const doneItems  = checkItems.filter(i => checkState[i.id]);
  const countLabel = checkItems.length > 0
    ? `${doneItems.length}/${checkItems.length}`
    : `${items.length}`;

  const hasBulk = checkItems.length > 0;

  let html = `<div class="section-block" id="section-${section.id}">
    <div class="section-header open" onclick="toggleSection(${section.id}, this)">
      <span class="drag-handle" data-section-id="${section.id}" onclick="event.stopPropagation()">⠿</span>
      <span class="section-icon">${section.icon || '📋'}</span>
      <span class="section-title">${esc(section.title)}</span>
      <span class="section-count" id="section-count-${section.id}">${countLabel}</span>
      <div class="section-edit-btns" onclick="event.stopPropagation()">
        <button class="icon-btn" style="font-size:14px" onclick="showEditSectionModal(${section.id},'${esc(section.icon||'')}','${esc(section.title)}')">✏️</button>
        <button class="icon-btn" style="font-size:14px" onclick="deleteSection(${section.id})">🗑</button>
      </div>
      <span class="section-chevron open">▼</span>
    </div>
    <div class="section-body open" id="section-body-${section.id}">
      <div class="section-body-inner">`;

  if (hasBulk) {
    html += `<div class="bulk-check-bar">
      <button class="bulk-btn" onclick="bulkCheck(${section.id}, true)">✓ CHECK ALL</button>
      <button class="bulk-btn" onclick="bulkCheck(${section.id}, false)">○ UNCHECK ALL</button>
    </div>`;
  }

  for (const item of items) html += renderItem(item);
  html += `<button class="add-item-btn" onclick="showAddItemModal(${section.id})">＋ ADD ITEM</button>`;
  html += `</div></div></div>`;
  return html;
}

function renderItem(item) {
  const doneClass = checkState[item.id] ? ' done' : '';
  const tag  = item.tag  ? `<span class="itag itag-${item.tag_color || 'blue'}">${esc(item.tag)}</span>` : '';
  const note = item.note ? `<div class="item-note">${esc(item.note)}</div>` : '';

  let iconHtml = '', typeClass = '';

  if (item.item_type === 'check') {
    typeClass = doneClass;
    iconHtml  = `<div class="item-checkbox${checkState[item.id]?' done':''}" onclick="toggleCheck(${item.id},this,event)"></div>`;
  } else if (item.item_type === 'never') {
    typeClass = ' never';
    iconHtml  = `<div class="never-x">✕</div>`;
  } else if (item.item_type === 'route_stop') {
    iconHtml = `<div class="route-dot ${item.tag_color || 'empty'}"></div>`;
  } else if (item.item_type === 'info') {
    iconHtml = `<div class="info-icon">ℹ</div>`;
  }

  return `<div class="item-row${typeClass}" id="item-${item.id}" data-item-id="${item.id}" data-section-id="${item.section_id}">
    <span class="item-drag-handle" onclick="event.stopPropagation()">⠿</span>
    <div class="item-icon">${iconHtml}</div>
    <div class="item-content">
      <div class="item-text">${esc(item.text)}${tag}</div>
      ${note}
    </div>
    <div class="item-edit-btns">
      <button class="icon-btn" style="font-size:13px" onclick="showEditItemModal(${item.id})">✏️</button>
      <button class="icon-btn" style="font-size:13px" onclick="deleteItem(${item.id})">🗑</button>
    </div>
  </div>`;
}

// ===================== CHECK TOGGLE =====================
function toggleCheck(itemId, el, event) {
  event.stopPropagation();
  const newState = !checkState[itemId];
  // Optimistic update
  checkState[itemId] = newState;
  localStorage.setItem('check_state', JSON.stringify(checkState));

  const row = document.getElementById('item-' + itemId);
  if (newState) { el.classList.add('done'); row && row.classList.add('done'); }
  else          { el.classList.remove('done'); row && row.classList.remove('done'); }

  updateProgressBar();
  updateSectionCount(el);

  // Sync to server (fire-and-forget)
  api('PUT', `/api/checklist/${itemId}`, { device_id: deviceId, checked: newState }).catch(() => {});
}

function bulkCheck(sectionId, checked) {
  const section = (currentDest?.sections || []).find(s => s.id === sectionId);
  if (!section) return;
  const checkItems = (section.items || []).filter(i => i.item_type === 'check');
  for (const item of checkItems) {
    checkState[item.id] = checked;
    const row = document.getElementById('item-' + item.id);
    const cb  = row?.querySelector('.item-checkbox');
    if (checked) { cb?.classList.add('done'); row?.classList.add('done'); }
    else         { cb?.classList.remove('done'); row?.classList.remove('done'); }
    // Sync each to server
    api('PUT', `/api/checklist/${item.id}`, { device_id: deviceId, checked }).catch(() => {});
  }
  localStorage.setItem('check_state', JSON.stringify(checkState));
  updateProgressBar();
  const countEl = document.getElementById('section-count-' + sectionId);
  if (countEl) countEl.textContent = checked ? `${checkItems.length}/${checkItems.length}` : `0/${checkItems.length}`;
}

function updateProgressBar() {
  const fill = document.getElementById('progress-fill');
  if (!fill || !currentDest) return;
  const allCheck = (currentDest.sections || []).flatMap(s =>
    (s.items || []).filter(i => i.item_type === 'check'));
  const total = allCheck.length;
  const done  = allCheck.filter(i => checkState[i.id]).length;
  const pct   = total > 0 ? Math.round((done / total) * 100) : 0;
  fill.style.width = pct + '%';
  const label = fill.closest('.progress-bar-wrap')?.querySelector('.progress-pct');
  if (label) label.textContent = pct + '%';
  const countSpan = fill.closest('.progress-bar-wrap')?.querySelector('.progress-bar-label span:last-child');
  if (countSpan) countSpan.innerHTML = `${done} / ${total} <span class="progress-pct">${pct}%</span>`;
}

function updateSectionCount(el) {
  const block = el.closest('.section-block');
  if (!block) return;
  const match = block.id.match(/section-(\d+)/);
  if (!match) return;
  const sectionId = parseInt(match[1]);
  const section = (currentDest?.sections || []).find(s => s.id === sectionId);
  if (!section) return;
  const checkItems = (section.items || []).filter(i => i.item_type === 'check');
  const done = checkItems.filter(i => checkState[i.id]).length;
  const countEl = document.getElementById('section-count-' + sectionId);
  if (countEl) countEl.textContent = `${done}/${checkItems.length}`;
}

function toggleSection(id, headerEl) {
  const body    = document.getElementById('section-body-' + id);
  const chevron = headerEl.querySelector('.section-chevron');
  if (body.classList.contains('open')) {
    body.classList.remove('open'); headerEl.classList.remove('open'); chevron.classList.remove('open');
  } else {
    body.classList.add('open'); headerEl.classList.add('open'); chevron.classList.add('open');

}

// ===================== DRAG REORDER =====================
function initSectionDrag() {
  const list = document.getElementById('sections-list');
  if (!list || !editMode) return;

  let dragSrc = null;

  list.querySelectorAll('.section-block').forEach(block => {
    if (block.tagName === 'BUTTON') return; // skip add-section-btn
    block.setAttribute('draggable', 'true');

    block.addEventListener('dragstart', e => {
      dragSrc = block;
      block.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    block.addEventListener('dragend', () => {
      block.classList.remove('dragging');
      list.querySelectorAll('.section-block').forEach(b => b.classList.remove('drag-over'));
      dragSrc = null;
    });
    block.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    block.addEventListener('dragenter', e => {
      e.preventDefault();
      if (block !== dragSrc) block.classList.add('drag-over');
    });
    block.addEventListener('dragleave', () => block.classList.remove('drag-over'));
    block.addEventListener('drop', async e => {
      e.preventDefault();
      if (!dragSrc || dragSrc === block) { block.classList.remove('drag-over'); return; }
      const blocks = [...list.querySelectorAll('.section-block[draggable="true"]')];
      const srcIdx = blocks.indexOf(dragSrc);
      const tgtIdx = blocks.indexOf(block);
      if (srcIdx < tgtIdx) list.insertBefore(dragSrc, block.nextSibling);
      else list.insertBefore(dragSrc, block);
      block.classList.remove('drag-over');
      // Persist new order
      const newOrder = [...list.querySelectorAll('.section-block[draggable="true"]')]
        .map((b, i) => {
          const m = b.id.match(/section-(\d+)/);
          return m ? { id: parseInt(m[1]), sort_order: i } : null;
        }).filter(Boolean);
      try {
        await api('POST', `/api/destinations/${currentDestId}/sections/reorder`, newOrder);
        const map = Object.fromEntries((currentDest.sections || []).map(s => [s.id, s]));
        currentDest.sections = newOrder.map(o => map[o.id]).filter(Boolean);
        toast('Sections reordered');
      } catch (err) { toast(err.message, 'error'); }
    });
  });

  // Item drag per section-body
  list.querySelectorAll('.section-body-inner').forEach(body => {
    let itemDragSrc = null;
    body.querySelectorAll('.item-row').forEach(row => {
      row.setAttribute('draggable', 'true');
      row.addEventListener('dragstart', e => {
        itemDragSrc = row; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
        e.stopPropagation(); // prevent section drag
      });
      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        body.querySelectorAll('.item-row').forEach(r => r.classList.remove('drag-over-item'));
        itemDragSrc = null;
      });
      row.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
      row.addEventListener('dragenter', e => {
        e.preventDefault(); e.stopPropagation();
        if (row !== itemDragSrc) row.classList.add('drag-over-item');
      });
      row.addEventListener('dragleave', () => row.classList.remove('drag-over-item'));
      row.addEventListener('drop', async e => {
        e.preventDefault(); e.stopPropagation();
        if (!itemDragSrc || itemDragSrc === row) { row.classList.remove('drag-over-item'); return; }
        const rows = [...body.querySelectorAll('.item-row[draggable="true"]')];
        const si = rows.indexOf(itemDragSrc), ti = rows.indexOf(row);
        if (si < ti) body.insertBefore(itemDragSrc, row.nextSibling);
        else body.insertBefore(itemDragSrc, row);
        row.classList.remove('drag-over-item');
        const sectionId = parseInt(row.dataset.sectionId);
        const newOrder = [...body.querySelectorAll('.item-row[draggable="true"]')]
          .map((r, i) => ({ id: parseInt(r.dataset.itemId), sort_order: i }));
        try {
          await api('POST', `/api/sections/${sectionId}/items/reorder`, newOrder);
          const sec = (currentDest.sections || []).find(s => s.id === sectionId);
          if (sec) {
            const map = Object.fromEntries((sec.items || []).map(it => [it.id, it]));
            sec.items = newOrder.map(o => map[o.id]).filter(Boolean);
          }
          toast('Items reordered');
        } catch (err) { toast(err.message, 'error'); }
      });
    });
  });
}

function exportToPDF() {

  setTimeout(() => window.print(), 300);

async function shareTrip() {
  if (!currentDest) return;
  const d = currentDest;
  const lines = [`🏍️ ${d.name.toUpperCase()} — ${d.subtitle || ''}`];
  lines.push(`📍 ${d.distance_km}km · ⏱ ${d.duration_hrs}`);
  if (d.tags?.length) lines.push(`🏷 ${d.tags.join(' · ')}`);
  lines.push('');
  for (const s of d.sections || []) {
    lines.push(`— ${s.title.toUpperCase()} —`);
    for (const item of s.items || []) {
      const prefix = item.item_type === 'check' ? (checkState[item.id] ? '✓' : '○')
                   : item.item_type === 'never' ? '✕'
                   : item.item_type === 'info'  ? 'ℹ'
                   : '•';
      lines.push(`  ${prefix} ${item.text}${item.note ? ` (${item.note})` : ''}`);
    }
    lines.push('');
  }
  const text = lines.join('\n');
  if (navigator.share) {
    try { await navigator.share({ title: `Trip to ${d.name}`, text }); return; } catch {}
  }
  try {
    await navigator.clipboard.writeText(text);
    toast('Trip summary copied to clipboard!');
  } catch { toast('Could not copy — check browser permissions', 'error'); }
}

      <option value="info"       ${item?.item_type==='info'?'selected':''}>Info</option>
    </select></div>
    <div class="form-group"><label>Text</label><input id="i-text" value="${item?esc(item.text):''}" placeholder="Item text" /></div>
    <div class="form-group"><label>Note (optional)</label><textarea id="i-note" placeholder="Additional note">${item?.note?esc(item.note):''}</textarea></div>
    <div class="form-group"><label>Tag label (optional)</label><input id="i-tag" value="${item?.tag?esc(item.tag):''}" placeholder="critical" /></div>
    <div class="form-group"><label>Tag color</label><select id="i-color">
      <option value=""      ${!item?.tag_color?'selected':''}>None</option>
      <option value="red"   ${item?.tag_color==='red'?'selected':''}>Red</option>
      <option value="amber" ${item?.tag_color==='amber'?'selected':''}>Amber</option>
      <option value="green" ${item?.tag_color==='green'?'selected':''}>Green</option>
      <option value="blue"  ${item?.tag_color==='blue'?'selected':''}>Blue</option>
    </select></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveItemModal(${isEdit?item.id:'null'},${sectionId})">Save</button>
    </div>
  `);
  document.getElementById('i-text').focus();
}

async function saveItemModal(editId, sectionId) {
  const payload = {
    item_type: document.getElementById('i-type').value,
    text:      document.getElementById('i-text').value.trim(),
    note:      document.getElementById('i-note').value.trim() || null,
    tag:       document.getElementById('i-tag').value.trim()  || null,
    tag_color: document.getElementById('i-color').value || '',
  };
  if (!payload.text) { toast('Text required', 'error'); return; }
  try {
    if (editId) {
      const updated = await api('PUT', '/api/items/' + editId, payload);
      for (const s of currentDest.sections) {
        const idx = s.items.findIndex(i => i.id === editId);
        if (idx !== -1) { s.items[idx] = updated; break; }
      }
      toast('Item updated');
    } else {
      const created = await api('POST', `/api/sections/${sectionId}/items`, payload);
      const s = currentDest.sections.find(s => s.id === sectionId);
      if (s) s.items.push(created);
      toast('Item added');
    }
    closeModal(); renderDestView();
  } catch (e) { toast(e.message, 'error'); }
}

// ===================== KEYBOARD SHORTCUTS =====================
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (document.getElementById('modal-backdrop')) {
    if (e.key === 'Escape') { closeModal(); return; }
    return;
  }
  switch (e.key) {
    case 'Escape':
      if (currentView === 'dest') goHome();
      break;
    case 'e':
    case 'E':
      if (token && userRole === 'admin') { handleEditBadge(); }
      break;
    case '/':
      e.preventDefault();
      if (currentView === 'home') {
        const inp = document.getElementById('search-input');
        if (inp) inp.focus();
      }
      break;
    case 'h':
    case 'H':
      if (currentView === 'dest') goHome();
      break;
    case 'p':
    case 'P':
      if (currentView === 'dest') exportToPDF();
      break;
  }
});

// ===================== UTILS =====================
function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
}

// ===================== INIT =====================
(async function init() {
  await checkAuth();
  if (token && userRole === 'admin') startSessionTimer();
  renderHome();
})();
</script>
