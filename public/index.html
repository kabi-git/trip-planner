<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trip Planner — Kabi & Deva</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0c0b;
    --card: #111412;
    --section: #161a15;
    --border: #202520;
    --border2: #2a302a;
    --green: #7fff6a;
    --amber: #f5c842;
    --red: #ff5e5e;
    --blue: #5ec8ff;
    --text: #e8ede8;
    --muted: #5a6358;
    --muted2: #7a8778;
    --font-head: 'Bebas Neue', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --font-body: 'DM Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .fade-in { animation: fadeIn 0.25s ease both; }

  /* TOPBAR */
  #topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 12, 11, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 52px;
  }

  #topbar .logo {
    font-family: var(--font-head);
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
  }

  #topbar .logo span { color: var(--green); }

  #topbar .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .edit-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--muted2);
    transition: all 0.15s;
    user-select: none;
  }

  body.edit-mode .edit-badge {
    color: var(--amber);
    border-color: var(--amber);
  }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted2);
    font-size: 18px;
    padding: 4px;
    border-radius: 4px;
    transition: color 0.15s;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-btn:hover { color: var(--text); }

  .back-btn {
    font-family: var(--font-mono);
    font-size: 12px;
    background: none;
    border: none;
    color: var(--muted2);
    cursor: pointer;
    padding: 5px 0;
    transition: color 0.15s;
    letter-spacing: 0.5px;
  }

  .back-btn:hover { color: var(--text); }

  /* MAIN */
  #app { padding: 0 0 80px; }

  /* HERO HOME */
  .hero-home {
    padding: 48px 24px 32px;
    max-width: 900px;
    margin: 0 auto;
  }

  .hero-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .hero-home h1 {
    font-family: var(--font-head);
    font-size: clamp(42px, 8vw, 72px);
    letter-spacing: 3px;
    line-height: 1;
    margin-bottom: 10px;
    color: var(--text);
  }

  .hero-home h1 span { color: var(--green); }

  .hero-sub {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* CONFIRMED BANNER */
  .confirmed-banner {
    max-width: 900px;
    margin: 0 auto 24px;
    padding: 0 24px;
  }

  .confirmed-banner-inner {
    background: rgba(127, 255, 106, 0.07);
    border: 1px solid rgba(127, 255, 106, 0.25);
    border-radius: 10px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .confirmed-banner-emoji { font-size: 32px; }

  .confirmed-banner-info { flex: 1; min-width: 160px; }

  .confirmed-banner-title {
    font-family: var(--font-head);
    font-size: 20px;
    color: var(--green);
    letter-spacing: 1.5px;
    margin-bottom: 3px;
  }

  .confirmed-banner-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted2);
  }

  .btn-open {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--green);
    color: #000;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 1px;
    white-space: nowrap;
    transition: opacity 0.15s;
  }

  .btn-open:hover { opacity: 0.85; }

  /* DESTINATION GRID */
  .dest-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .dest-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
  }

  .dest-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .dest-card-emoji { font-size: 36px; margin-bottom: 10px; display: block; }

  .dest-card-name {
    font-family: var(--font-head);
    font-size: 30px;
    letter-spacing: 1.5px;
    color: var(--text);
    margin-bottom: 4px;
    line-height: 1;
  }

  .dest-card-sub {
    font-size: 13px;
    color: var(--muted2);
    margin-bottom: 12px;
    font-weight: 300;
  }

  .stat-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .stat-pill {
    font-family: var(--font-mono);
    font-size: 10px;
    background: var(--section);
    border: 1px solid var(--border2);
    border-radius: 3px;
    padding: 3px 8px;
    color: var(--muted2);
    white-space: nowrap;
  }

  .tag-chips {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .tag-chip {
    font-family: var(--font-mono);
    font-size: 9px;
    padding: 3px 7px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .tag-chip-default {
    background: rgba(90,99,88,0.2);
    color: var(--muted2);
    border: 1px solid var(--border2);
  }

  .tag-chip-confirmed {
    background: rgba(127,255,106,0.1);
    color: var(--green);
    border: 1px solid rgba(127,255,106,0.3);
  }

  .add-dest-card {
    background: transparent;
    border: 1.5px dashed var(--border2);
    border-radius: 12px;
    padding: 22px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    min-height: 140px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    gap: 8px;
    transition: border-color 0.15s, color 0.15s;
  }

  body.edit-mode .add-dest-card { display: flex; }

  .add-dest-card:hover { border-color: var(--muted2); color: var(--muted2); }

  /* DEST DETAIL */
  .dest-hero {
    padding: 36px 24px 24px;
    max-width: 780px;
    margin: 0 auto;
  }

  .dest-hero-emoji { font-size: 52px; display: block; margin-bottom: 10px; }

  .dest-hero h1 {
    font-family: var(--font-head);
    font-size: clamp(36px, 7vw, 60px);
    letter-spacing: 2px;
    line-height: 1;
    margin-bottom: 6px;
  }

  .dest-hero-sub {
    font-size: 14px;
    color: var(--muted2);
    margin-bottom: 12px;
    font-weight: 300;
  }

  /* PROGRESS BAR */
  .progress-bar-wrap {
    max-width: 780px;
    margin: 0 auto 20px;
    padding: 0 24px;
  }

  .progress-bar-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }

  .progress-bar-track {
    height: 4px;
    background: var(--border2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  /* SECTIONS */
  .sections-list {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .section-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .section-header.open { border-bottom-color: var(--border); }

  .section-icon {
    font-size: 18px;
    width: 24px;
    text-align: center;
    flex-shrink: 0;
  }

  .section-title {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text);
    flex: 1;
  }

  .section-count {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
  }

  .section-edit-btns {
    display: none;
    gap: 4px;
    align-items: center;
  }

  body.edit-mode .section-edit-btns { display: flex; }

  .section-chevron {
    color: var(--muted);
    font-size: 12px;
    transition: transform 0.2s;
    margin-left: 4px;
  }

  .section-chevron.open { transform: rotate(180deg); }

  .section-body {
    padding: 4px 0;
    display: none;
  }

  .section-body.open { display: block; }

  /* ITEMS */
  .item-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 16px;
    position: relative;
    transition: background 0.1s;
  }

  .item-row:hover { background: rgba(255,255,255,0.02); }

  .item-icon {
    width: 22px;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Checkbox */
  .item-checkbox {
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--border2);
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
    background: transparent;
  }

  .item-checkbox.done {
    background: var(--green);
    border-color: var(--green);
  }

  .item-checkbox.done::after {
    content: '';
    width: 5px;
    height: 9px;
    border: 2px solid #000;
    border-left: none;
    border-top: none;
    transform: rotate(45deg) translateY(-1px);
  }

  /* Never */
  .never-x {
    color: var(--red);
    font-size: 14px;
    font-weight: bold;
    line-height: 1;
    margin-top: 2px;
  }

  /* Route dot */
  .route-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 5px;
  }

  .route-dot.green { background: var(--green); }
  .route-dot.amber { background: var(--amber); }
  .route-dot.red   { background: var(--red); }
  .route-dot.blue  { background: var(--blue); }
  .route-dot.empty { background: var(--muted); }

  /* Info */
  .info-icon { color: var(--blue); font-size: 14px; margin-top: 2px; }

  .item-content { flex: 1; min-width: 0; }

  .item-text {
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.4;
    font-weight: 400;
  }

  .item-row.never .item-text { color: var(--red); }
  .item-row.done .item-text  { color: var(--muted); text-decoration: line-through; }

  .item-note {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
    line-height: 1.5;
  }

  /* Inline tag chips */
  .itag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 6px;
    vertical-align: middle;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .itag-red   { background: rgba(255,94,94,0.12);  color: var(--red);   border: 1px solid rgba(255,94,94,0.25); }
  .itag-amber { background: rgba(245,200,66,0.12); color: var(--amber); border: 1px solid rgba(245,200,66,0.25); }
  .itag-green { background: rgba(127,255,106,0.1); color: var(--green); border: 1px solid rgba(127,255,106,0.2); }
  .itag-blue  { background: rgba(94,200,255,0.1);  color: var(--blue);  border: 1px solid rgba(94,200,255,0.2); }

  .item-edit-btns {
    display: none;
    gap: 4px;
    align-items: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  body.edit-mode .item-edit-btns { display: flex; }

  .add-item-btn {
    display: none;
    width: 100%;
    background: none;
    border: none;
    border-top: 1px dashed var(--border);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 10px 16px;
    cursor: pointer;
    text-align: left;
    gap: 6px;
    transition: color 0.15s;
  }

  body.edit-mode .add-item-btn { display: flex; }
  .add-item-btn:hover { color: var(--muted2); }

  /* Add section */
  .add-section-btn {
    display: none;
    background: transparent;
    border: 1.5px dashed var(--border2);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    gap: 6px;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, color 0.15s;
  }

  body.edit-mode .add-section-btn { display: flex; }
  .add-section-btn:hover { border-color: var(--muted2); color: var(--muted2); }

  /* CONFIRM FOOTER */
  .confirm-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 20px;
    background: rgba(10,12,11,0.92);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    z-index: 90;
  }

  .confirm-btn {
    width: 100%;
    max-width: 480px;
    display: block;
    margin: 0 auto;
    background: var(--green);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 13px 20px;
    font-family: var(--font-head);
    font-size: 18px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .confirm-btn:hover { opacity: 0.85; }

  .confirmed-static {
    font-family: var(--font-head);
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--muted);
    padding: 13px 0;
    flex: 1;
    text-align: center;
  }

  .confirmed-footer-row {
    display: flex;
    align-items: center;
    max-width: 480px;
    margin: 0 auto;
    gap: 10px;
  }

  .unconfirm-btn {
    flex-shrink: 0;
    background: none;
    border: 1px solid var(--border2);
    color: var(--muted2);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 8px 12px;
    border-radius: 5px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: border-color 0.15s, color 0.15s;
    white-space: nowrap;
  }

  .unconfirm-btn:hover { border-color: var(--red); color: var(--red); }

  /* MODALS */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal {
    background: var(--card);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
  }

  .modal h3 {
    font-family: var(--font-head);
    font-size: 22px;
    letter-spacing: 1px;
    margin-bottom: 18px;
    color: var(--text);
  }

  .form-group {
    margin-bottom: 14px;
  }

  .form-group label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted2);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 5px;
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    background: var(--section);
    border: 1px solid var(--border2);
    border-radius: 5px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 9px 11px;
    outline: none;
    transition: border-color 0.15s;
    appearance: none;
  }

  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    border-color: var(--green);
  }

  .form-group input.error { border-color: var(--red); }

  .form-group textarea { resize: vertical; min-height: 80px; }

  .form-group select option { background: var(--card); }

  .modal-btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    justify-content: flex-end;
  }

  .btn-cancel {
    background: none;
    border: 1px solid var(--border2);
    color: var(--muted2);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 5px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .btn-cancel:hover { border-color: var(--muted2); }

  .btn-save {
    background: var(--green);
    border: none;
    color: #000;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 5px;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .btn-save:hover { opacity: 0.85; }

  /* TOAST */
  #toast-container {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .toast {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 9px 18px;
    border-radius: 5px;
    animation: slideUp 0.2s ease both;
    white-space: nowrap;
  }

  .toast.success { background: rgba(127,255,106,0.15); border: 1px solid rgba(127,255,106,0.3); color: var(--green); }
  .toast.error   { background: rgba(255,94,94,0.15);  border: 1px solid rgba(255,94,94,0.3);  color: var(--red); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<div id="topbar">
  <div id="topbar-left"></div>
  <div class="topbar-right">
    <div id="topbar-dest-btns" style="display:none; gap:8px; align-items:center;"></div>
    <button class="edit-badge" id="edit-badge" onclick="handleEditBadge()">🔒 EDIT</button>
  </div>
</div>

<div id="app"></div>
<div id="toast-container"></div>

<script>
// ===================== STATE =====================
let token = localStorage.getItem('auth_token') || null;
let editMode = false;
let currentView = 'home';
let currentDestId = null;
let destinations = [];
let currentDest = null;
let checkState = JSON.parse(localStorage.getItem('check_state') || '{}');

// ===================== API =====================
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' },
  };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ===================== AUTH =====================
async function checkAuth() {
  if (!token) return;
  try {
    const r = await api('GET', '/api/auth/check');
    if (!r.authenticated) { token = null; localStorage.removeItem('auth_token'); }
  } catch { token = null; localStorage.removeItem('auth_token'); }
}

async function login(password) {
  const data = await api('POST', '/api/auth/login', { password });
  token = data.token;
  localStorage.setItem('auth_token', token);
}

async function logout() {
  try { await api('POST', '/api/auth/logout'); } catch {}
  token = null;
  localStorage.removeItem('auth_token');
  editMode = false;
  document.body.classList.remove('edit-mode');
  updateEditBadge();
}

// ===================== EDIT BADGE =====================
function updateEditBadge() {
  const badge = document.getElementById('edit-badge');
  if (editMode) badge.textContent = '✏️ EDIT ON';
  else badge.textContent = '🔒 EDIT';
}

async function handleEditBadge() {
  if (editMode) {
    await logout();
    render();
    return;
  }
  if (token) {
    editMode = true;
    document.body.classList.add('edit-mode');
    updateEditBadge();
    render();
    return;
  }
  showPasswordModal(() => {
    editMode = true;
    document.body.classList.add('edit-mode');
    updateEditBadge();
    render();
  });
}

// ===================== TOAST =====================
function toast(msg, type = 'success') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => { el.remove(); }, 2500);
}

// ===================== RENDER =====================
function render() {
  updateEditBadge();
  if (currentView === 'home') renderHome();
  else renderDest();
}

  currentDestId = null;
  document.getElementById('topbar-left').innerHTML = `<div class="logo" onclick="goHome()">TRIP <span>PLANNER</span></div>`;
  document.getElementById('topbar-dest-btns').style.display = 'none';

  destinations = await api('GET', '/api/destinations');
  const confirmed = destinations.find(d => d.confirmed);

  let html = `<div class="fade-in">
    <div class="hero-home">
      <div class="hero-label">Anniversary · July 5th · 2025</div>
      <h1>WHERE ARE WE <span>GOING?</span></h1>
      <div class="hero-sub">KABI & DEVA · PICK THE ADVENTURE</div>

    html += `<div class="confirmed-banner">
      <div class="confirmed-banner-inner">
        <div class="confirmed-banner-emoji">${confirmed.emoji || '🏍️'}</div>
        <div class="confirmed-banner-info">
          <div class="confirmed-banner-title">WE'RE GOING TO ${esc(confirmed.name.toUpperCase())} 🏍️❤️</div>

function renderDestCard(d) {

// ===================== DEST DETAIL =====================
async function openDest(id) {
  currentView = 'dest';
  currentDestId = id;
  currentDest = await api('GET', '/api/destinations/' + id);
  renderDestView();
}

function renderDestView() {
  const d = currentDest;
  document.getElementById('topbar-left').innerHTML = `<button class="back-btn" onclick="goHome()">← ALL DESTINATIONS</button>`;

  // Dest edit/delete btns in topbar
  const destBtns = document.getElementById('topbar-dest-btns');
  destBtns.style.display = 'flex';
  destBtns.innerHTML = `
    <button class="icon-btn" title="Edit destination" onclick="showEditDestModal()">✏️</button>
    <button class="icon-btn" title="Delete destination" onclick="deleteDestination()">🗑</button>
  `;

  // Count checkable items for progress bar
  const allCheckItems = [];
  for (const s of d.sections || []) {
    for (const it of s.items || []) {
      if (it.item_type === 'check') allCheckItems.push(it);
    }
  }
  const totalCheck = allCheckItems.length;
  const doneCheck = allCheckItems.filter(it => checkState[it.id]).length;

  let html = `<div class="fade-in">
    <div class="dest-hero">
      <span class="dest-hero-emoji">${d.emoji || '📍'}</span>
      <h1>${esc(d.name)}</h1>
      <div class="dest-hero-sub">${esc(d.subtitle || '')}</div>
      <div class="stat-pills">
        <span class="stat-pill">📍 ${d.distance_km} km</span>
        <span class="stat-pill">⏱ ${esc(d.duration_hrs || '')}</span>
      </div>
      <div class="tag-chips">
        ${(d.tags || []).map(t => `<span class="tag-chip tag-chip-default">${esc(t)}</span>`).join('')}
      </div>
    </div>`;

  if (totalCheck > 0) {
    const pct = Math.round((doneCheck / totalCheck) * 100);
    html += `<div class="progress-bar-wrap">
      <div class="progress-bar-label">
        <span>CHECKLIST PROGRESS</span>
        <span>${doneCheck} / ${totalCheck}</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill" style="width:${pct}%"></div>
      </div>
    </div>`;
  }

  html += `<div class="sections-list" id="sections-list">`;
  for (const section of d.sections || []) {
    html += renderSection(section);
  }
  html += `<button class="add-section-btn" onclick="showAddSectionModal()">＋ ADD SECTION</button>`;
  html += `</div></div>`;

  // Confirm footer
  html += `<div class="confirm-footer">`;
  if (d.confirmed) {
    html += `<div class="confirmed-footer-row">
      <div class="confirmed-static">✓ THIS IS THE ONE</div>
      <button class="unconfirm-btn" onclick="unconfirmTrip()" title="Undo confirmation">↩ UNDO</button>
    </div>`;
  } else {
    html += `<button class="confirm-btn" onclick="confirmTrip()">WE'RE GOING TO ${esc(d.name.toUpperCase())} 🏍️❤️</button>`;
  }
  html += `</div>`;

  document.getElementById('app').innerHTML = html;
}

function renderSection(section) {
  const items = section.items || [];
  const checkItems = items.filter(i => i.item_type === 'check');
  const doneItems = checkItems.filter(i => checkState[i.id]);
  const countLabel = checkItems.length > 0 ? `${doneItems.length}/${checkItems.length}` : `${items.length}`;

  let html = `<div class="section-block" id="section-${section.id}">
    <div class="section-header open" onclick="toggleSection(${section.id}, this)">
      <span class="section-icon">${section.icon || '📋'}</span>
      <span class="section-title">${esc(section.title)}</span>
      <span class="section-count" id="section-count-${section.id}">${countLabel}</span>
      <div class="section-edit-btns" onclick="event.stopPropagation()">
        <button class="icon-btn" style="font-size:14px" onclick="showEditSectionModal(${section.id}, '${esc(section.icon || '')}', '${esc(section.title)}')">✏️</button>
        <button class="icon-btn" style="font-size:14px" onclick="deleteSection(${section.id})">🗑</button>
      </div>
      <span class="section-chevron open">▼</span>
    </div>
    <div class="section-body open" id="section-body-${section.id}">`;

  for (const item of items) {
    html += renderItem(item);
  }

  html += `<button class="add-item-btn" onclick="showAddItemModal(${section.id})">＋ ADD ITEM</button>`;
  html += `</div></div>`;
  return html;
}

function renderItem(item) {
  const doneClass = checkState[item.id] ? ' done' : '';
  const tag = item.tag ? `<span class="itag itag-${item.tag_color || 'blue'}">${esc(item.tag)}</span>` : '';
  const note = item.note ? `<div class="item-note">${esc(item.note)}</div>` : '';

  let iconHtml = '';
  let typeClass = '';

  if (item.item_type === 'check') {
    typeClass = doneClass;
    const doneAttr = checkState[item.id] ? ' done' : '';
    iconHtml = `<div class="item-checkbox${doneAttr}" onclick="toggleCheck(${item.id}, this, event)"></div>`;
  } else if (item.item_type === 'never') {
    typeClass = ' never';
    iconHtml = `<div class="never-x">✕</div>`;
  } else if (item.item_type === 'route_stop') {
    const color = item.tag_color || 'empty';
    iconHtml = `<div class="route-dot ${color}"></div>`;
  } else if (item.item_type === 'info') {
    iconHtml = `<div class="info-icon">ℹ</div>`;
  }

  return `<div class="item-row${typeClass}" id="item-${item.id}">
    <div class="item-icon">${iconHtml}</div>
    <div class="item-content">
      <div class="item-text">${esc(item.text)}${tag}</div>
      ${note}
    </div>
    <div class="item-edit-btns">
      <button class="icon-btn" style="font-size:13px" onclick="showEditItemModal(${item.id})">✏️</button>
      <button class="icon-btn" style="font-size:13px" onclick="deleteItem(${item.id})">🗑</button>
    </div>
  </div>`;
}

// ===================== CHECK TOGGLE =====================
function toggleCheck(itemId, el, event) {
  event.stopPropagation();
  checkState[itemId] = !checkState[itemId];
  localStorage.setItem('check_state', JSON.stringify(checkState));

  const row = document.getElementById('item-' + itemId);
  if (checkState[itemId]) {
    el.classList.add('done');
    row.classList.add('done');
  } else {
    el.classList.remove('done');
    row.classList.remove('done');
  }
  updateProgressBar();
  updateSectionCount(el);
}

function updateProgressBar() {
  const fill = document.getElementById('progress-fill');
  if (!fill || !currentDest) return;
  const allCheckItems = [];
  for (const s of currentDest.sections || []) {
    for (const it of s.items || []) {
      if (it.item_type === 'check') allCheckItems.push(it);
    }
  }
  const total = allCheckItems.length;
  const done = allCheckItems.filter(it => checkState[it.id]).length;
  fill.style.width = total > 0 ? Math.round((done / total) * 100) + '%' : '0%';
}

function updateSectionCount(el) {
  // Find parent section-block
  const block = el.closest('.section-block');
  if (!block) return;
  const match = block.id.match(/section-(\d+)/);
  if (!match) return;
  const sectionId = parseInt(match[1]);
  const section = (currentDest?.sections || []).find(s => s.id === sectionId);
  if (!section) return;
  const checkItems = (section.items || []).filter(i => i.item_type === 'check');
  const done = checkItems.filter(i => checkState[i.id]).length;
  const countEl = document.getElementById('section-count-' + sectionId);
  if (countEl) countEl.textContent = `${done}/${checkItems.length}`;
}

function toggleSection(id, headerEl) {
  const body = document.getElementById('section-body-' + id);
  const chevron = headerEl.querySelector('.section-chevron');
  if (body.classList.contains('open')) {
    body.classList.remove('open');
    headerEl.classList.remove('open');
    chevron.classList.remove('open');
  } else {
    body.classList.add('open');
    headerEl.classList.add('open');
    chevron.classList.add('open');
  }
}

// ===================== NAVIGATION =====================
async function goHome() {
  currentView = 'home';
  currentDestId = null;
  currentDest = null;
  // Remove confirm footer if exists
  renderHome();
}

// ===================== CONFIRM / UNCONFIRM TRIP =====================
async function unconfirmTrip() {
  if (!token) {
    showPasswordModal(async () => {
      editMode = true;
      document.body.classList.add('edit-mode');
      updateEditBadge();
      await doUnconfirmTrip();
    });
    return;
  }
  await doUnconfirmTrip();
}

async function doUnconfirmTrip() {
  if (!confirm('Remove this as the confirmed destination?')) return;
  try {
    await api('PUT', '/api/destinations/' + currentDest.id, { confirmed: false });
    currentDest = await api('GET', '/api/destinations/' + currentDest.id);
    toast('Confirmation removed');
    renderDestView();
  } catch (e) {
    toast(e.message, 'error');
  }
}


async function confirmTrip() {
  if (!token) {
    showPasswordModal(async () => {
      editMode = true;
      document.body.classList.add('edit-mode');
      updateEditBadge();
      await doConfirmTrip();
    });
    return;
  }
  await doConfirmTrip();
}

async function doConfirmTrip() {
  if (!confirm(`Set "${currentDest.name}" as THE destination?`)) return;
  try {
    await api('PUT', '/api/destinations/' + currentDest.id, { confirmed: true });
    currentDest = await api('GET', '/api/destinations/' + currentDest.id);
    toast('Trip confirmed! 🏍️❤️');
    renderDestView();
  } catch (e) {
    toast(e.message, 'error');
  }
}

// ===================== DESTINATION CRUD =====================
async function deleteDestination() {
  if (!confirm('Delete this destination?')) return;
  try {
    await api('DELETE', '/api/destinations/' + currentDestId);
    toast('Destination deleted');
    goHome();
  } catch (e) { toast(e.message, 'error'); }
}

// ===================== SECTION CRUD =====================
async function deleteSection(id) {
  if (!confirm('Delete this section and all its items?')) return;
  try {
    await api('DELETE', '/api/sections/' + id);
    currentDest.sections = currentDest.sections.filter(s => s.id !== id);
    renderDestView();
    toast('Section deleted');
  } catch (e) { toast(e.message, 'error'); }
}

// ===================== ITEM CRUD =====================
async function deleteItem(id) {
  if (!confirm('Delete this item?')) return;
  try {
    await api('DELETE', '/api/items/' + id);
    for (const s of currentDest.sections) {
      s.items = s.items.filter(i => i.id !== id);
    }
    renderDestView();
    toast('Item deleted');
  } catch (e) { toast(e.message, 'error'); }
}

// ===================== MODALS =====================
function showModal(html) {
  closeModal();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">${html}</div>`;
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) closeModal();
  });
  document.body.appendChild(backdrop);
}

function closeModal() {
  const m = document.getElementById('modal-backdrop');
  if (m) m.remove();
}

// Password modal
function showPasswordModal(onSuccess) {
  showModal(`
    <h3>ENTER PASSWORD</h3>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="pw-input" placeholder="Enter admin password" autocomplete="current-password" />
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="submitPassword()">Unlock</button>
    </div>
  `);
  const inp = document.getElementById('pw-input');
  inp.focus();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') submitPassword(); });
  window._pwCallback = onSuccess;
}

async function submitPassword() {
  const inp = document.getElementById('pw-input');
  const pw = inp.value;
  try {
    await login(pw);
    closeModal();
    if (window._pwCallback) { window._pwCallback(); window._pwCallback = null; }
  } catch {
    inp.classList.add('error');
    inp.value = '';
    inp.focus();
    setTimeout(() => inp.classList.remove('error'), 1000);
  }
}

// Add/Edit Destination
function showAddDestModal() {
  showDestModal(null);
}

function showEditDestModal() {
  showDestModal(currentDest);
}

function showDestModal(dest) {
  const isEdit = !!dest;
  showModal(`
    <h3>${isEdit ? 'EDIT' : 'ADD'} DESTINATION</h3>
    <div class="form-group"><label>Emoji</label><input id="d-emoji" value="${dest ? esc(dest.emoji || '') : ''}" placeholder="🏔️" /></div>
    <div class="form-group"><label>Name</label><input id="d-name" value="${dest ? esc(dest.name) : ''}" placeholder="Vagamon" /></div>
    <div class="form-group"><label>Subtitle</label><input id="d-sub" value="${dest ? esc(dest.subtitle || '') : ''}" placeholder="Ghats · Monsoon" /></div>
    <div class="form-group"><label>Distance (km)</label><input id="d-km" type="number" value="${dest ? dest.distance_km : ''}" placeholder="240" /></div>
    <div class="form-group"><label>Duration</label><input id="d-dur" value="${dest ? esc(dest.duration_hrs || '') : ''}" placeholder="6-7 hrs one way" /></div>
    <div class="form-group"><label>Tags (comma separated)</label><input id="d-tags" value="${dest ? esc((dest.tags || []).join(', ')) : ''}" placeholder="GHATS, MONSOON" /></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveDestModal(${isEdit ? dest.id : 'null'})">Save</button>
    </div>
  `);
}

async function saveDestModal(editId) {
  const payload = {
    emoji: document.getElementById('d-emoji').value.trim(),
    name: document.getElementById('d-name').value.trim(),
    subtitle: document.getElementById('d-sub').value.trim(),
    distance_km: parseInt(document.getElementById('d-km').value) || 0,
    duration_hrs: document.getElementById('d-dur').value.trim(),
    tags: document.getElementById('d-tags').value.split(',').map(t => t.trim()).filter(Boolean),
  };
  if (!payload.name) { toast('Name required', 'error'); return; }
  try {
    if (editId) {
      await api('PUT', '/api/destinations/' + editId, payload);
      currentDest = await api('GET', '/api/destinations/' + editId);
      toast('Destination updated');
      closeModal();
      renderDestView();
    } else {
      const d = await api('POST', '/api/destinations', payload);
      toast('Destination added');
      closeModal();
      openDest(d.id);
    }
  } catch (e) { toast(e.message, 'error'); }
}

// Add/Edit Section
function showAddSectionModal() { showSectionModal(null, null, null, null); }
function showEditSectionModal(id, icon, title) { showSectionModal(id, icon, title, null); }

function showSectionModal(id, icon, title, type) {
  const isEdit = !!id;
  showModal(`
    <h3>${isEdit ? 'EDIT' : 'ADD'} SECTION</h3>
    <div class="form-group"><label>Icon (emoji)</label><input id="s-icon" value="${icon ? esc(icon) : ''}" placeholder="🛣️" /></div>
    <div class="form-group"><label>Title</label><input id="s-title" value="${title ? esc(title) : ''}" placeholder="Route + Speed Zones" /></div>
    ${!isEdit ? `<div class="form-group"><label>Type</label><select id="s-type">
      <option value="checklist">Checklist</option>
      <option value="route">Route</option>
      <option value="hotels">Hotels / Stay</option>
      <option value="activities">Activities</option>
      <option value="custom">Custom</option>
    </select></div>` : ''}
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveSectionModal(${id || 'null'})">Save</button>
    </div>
  `);
}

async function saveSectionModal(editId) {
  const icon = document.getElementById('s-icon').value.trim();
  const title = document.getElementById('s-title').value.trim();
  if (!title) { toast('Title required', 'error'); return; }
  try {
    if (editId) {
      await api('PUT', '/api/sections/' + editId, { icon, title });
      const s = currentDest.sections.find(s => s.id === editId);
      if (s) { s.icon = icon; s.title = title; }
      toast('Section updated');
      closeModal();
      renderDestView();
    } else {
      const typeEl = document.getElementById('s-type');
      const type = typeEl ? typeEl.value : 'custom';
      const s = await api('POST', '/api/destinations/' + currentDestId + '/sections', { icon, title, type });
      currentDest.sections.push(s);
      toast('Section added');
      closeModal();
      renderDestView();
    }
  } catch (e) { toast(e.message, 'error'); }
}

// Add/Edit Item
function showAddItemModal(sectionId) { showItemModal(null, sectionId); }
async function showEditItemModal(itemId) {
  let item = null;
  for (const s of currentDest.sections) {
    item = s.items.find(i => i.id === itemId);
    if (item) break;
  }
  if (!item) return;
  showItemModal(item, item.section_id);
}

function showItemModal(item, sectionId) {
  const isEdit = !!item;
  showModal(`
    <h3>${isEdit ? 'EDIT' : 'ADD'} ITEM</h3>
    <div class="form-group"><label>Type</label><select id="i-type">
      <option value="check" ${item?.item_type === 'check' ? 'selected' : ''}>Check</option>
      <option value="never" ${item?.item_type === 'never' ? 'selected' : ''}>Never</option>
      <option value="route_stop" ${item?.item_type === 'route_stop' ? 'selected' : ''}>Route Stop</option>
      <option value="info" ${item?.item_type === 'info' ? 'selected' : ''}>Info</option>
    </select></div>
    <div class="form-group"><label>Text</label><input id="i-text" value="${item ? esc(item.text) : ''}" placeholder="Item text" /></div>
    <div class="form-group"><label>Note (optional)</label><textarea id="i-note" placeholder="Additional note">${item?.note ? esc(item.note) : ''}</textarea></div>
    <div class="form-group"><label>Tag label (optional)</label><input id="i-tag" value="${item?.tag ? esc(item.tag) : ''}" placeholder="critical" /></div>
    <div class="form-group"><label>Tag color</label><select id="i-color">
      <option value="" ${!item?.tag_color ? 'selected' : ''}>None</option>
      <option value="red" ${item?.tag_color === 'red' ? 'selected' : ''}>Red</option>
      <option value="amber" ${item?.tag_color === 'amber' ? 'selected' : ''}>Amber</option>
      <option value="green" ${item?.tag_color === 'green' ? 'selected' : ''}>Green</option>
      <option value="blue" ${item?.tag_color === 'blue' ? 'selected' : ''}>Blue</option>
    </select></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveItemModal(${isEdit ? item.id : 'null'}, ${sectionId})">Save</button>
    </div>
  `);
}

async function saveItemModal(editId, sectionId) {
  const payload = {
    item_type: document.getElementById('i-type').value,
    text: document.getElementById('i-text').value.trim(),
    note: document.getElementById('i-note').value.trim() || null,
    tag: document.getElementById('i-tag').value.trim() || null,
    tag_color: document.getElementById('i-color').value || '',
  };
  if (!payload.text) { toast('Text required', 'error'); return; }
  try {
    if (editId) {
      const updated = await api('PUT', '/api/items/' + editId, payload);
      for (const s of currentDest.sections) {
        const idx = s.items.findIndex(i => i.id === editId);
        if (idx !== -1) { s.items[idx] = updated; break; }
      }
      toast('Item updated');
    } else {
      const created = await api('POST', '/api/sections/' + sectionId + '/items', payload);
      const s = currentDest.sections.find(s => s.id === sectionId);
      if (s) s.items.push(created);
      toast('Item added');
    }
    closeModal();
    renderDestView();
  } catch (e) { toast(e.message, 'error'); }
}

// ===================== UTILS =====================
function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#x27;');
}

// ===================== INIT =====================
(async function init() {
  await checkAuth();
  renderHome();
})();
</script>
