<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trip Planner — Kabi & Deva</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:      #0a0c0b;
  --surface: #111412;
  --s2:      #161a15;
  --border:  #1e231e;
  --border2: #262c26;
  --green:   #7fff6a;
  --amber:   #f5c842;
  --red:     #ff5e5e;
  --blue:    #5ec8ff;
  --text:    #e8ede8;
  --muted:   #566254;
  --muted2:  #788776;
  --fh: 'Bebas Neue', sans-serif;
  --fm: 'DM Mono', monospace;
  --fb: 'DM Sans', sans-serif;
  --r: 10px;
  --max: 820px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--fb); min-height: 100vh; overflow-x: hidden; }

/* ── TOPBAR ── */
#topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,12,11,0.9); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 52px; gap: 12px;
}
.logo { font-family: var(--fh); font-size: 20px; letter-spacing: 2px; cursor: pointer; user-select: none; flex-shrink: 0; }
.logo span { color: var(--green); }
.back-btn { font-family: var(--fm); font-size: 11px; background: none; border: none; color: var(--muted2); cursor: pointer; padding: 4px 0; letter-spacing: 0.5px; transition: color 0.15s; flex-shrink: 0; }
.back-btn:hover { color: var(--text); }
.topbar-right { display: flex; align-items: center; gap: 6px; }
.edit-badge { font-family: var(--fm); font-size: 10px; padding: 5px 10px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border2); background: transparent; color: var(--muted2); transition: all 0.15s; user-select: none; }
body.edit-mode .edit-badge { color: var(--amber); border-color: var(--amber); }
body.viewer-mode .edit-badge { color: var(--blue); border-color: var(--blue); }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--muted2); font-size: 17px; padding: 5px; border-radius: 5px; transition: color 0.15s; line-height: 1; display: flex; align-items: center; }
.icon-btn:hover { color: var(--text); }

/* ── SESSION BANNER ── */
.session-banner { background: rgba(245,200,66,0.08); border-bottom: 1px solid rgba(245,200,66,0.25); padding: 8px 20px; display: flex; align-items: center; justify-content: space-between; font-family: var(--fm); font-size: 11px; color: var(--amber); gap: 12px; }
.session-banner.hidden { display: none; }
.session-banner button { background: none; border: 1px solid var(--amber); color: var(--amber); font-family: var(--fm); font-size: 10px; padding: 3px 10px; border-radius: 3px; cursor: pointer; }

/* ── LAYOUT ── */
#app { padding: 0 0 88px; }
.page { max-width: var(--max); margin: 0 auto; padding: 0 20px; }

/* ── HOME HERO ── */
.home-hero { padding: 44px 20px 28px; max-width: var(--max); margin: 0 auto; }
.home-hero .eyebrow { font-family: var(--fm); font-size: 10px; color: var(--muted); letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 10px; }
.home-hero h1 { font-family: var(--fh); font-size: clamp(40px, 8vw, 68px); letter-spacing: 3px; line-height: 1; color: var(--text); }
.home-hero h1 span { color: var(--green); }
.home-hero .sub { font-family: var(--fm); font-size: 11px; color: var(--muted); letter-spacing: 2px; margin-top: 8px; }


/* ── CONTROLS ── */
.controls { max-width: var(--max); margin: 0 auto 20px; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
.search-row { display: flex; gap: 8px; }
.search-input { flex: 1; background: var(--surface); border: 1px solid var(--border2); border-radius: 7px; color: var(--text); font-family: var(--fb); font-size: 13px; padding: 9px 13px; outline: none; transition: border-color 0.15s; }
.search-input::placeholder { color: var(--muted); }
.search-input:focus { border-color: var(--green); }
.sort-select { background: var(--surface); border: 1px solid var(--border2); border-radius: 7px; color: var(--muted2); font-family: var(--fm); font-size: 11px; padding: 9px 11px; outline: none; cursor: pointer; appearance: none; }
.sort-select:focus { border-color: var(--green); color: var(--text); }
.sort-select option { background: var(--surface); }
.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filter-label { font-family: var(--fm); font-size: 10px; color: var(--muted); letter-spacing: 1px; }
.chip { font-family: var(--fm); font-size: 10px; padding: 4px 11px; border-radius: 20px; cursor: pointer; border: 1px solid var(--border2); background: transparent; color: var(--muted2); transition: all 0.15s; user-select: none; }
.chip:hover { border-color: var(--muted2); color: var(--text); }
.chip.active { background: rgba(127,255,106,0.1); border-color: var(--green); color: var(--green); }

/* ── CONFIRMED BANNER ── */
.confirmed-banner { max-width: var(--max); margin: 0 auto 24px; padding: 0 20px; }
.confirmed-inner { background: linear-gradient(135deg, rgba(127,255,106,0.07), rgba(127,255,106,0.03)); border: 1px solid rgba(127,255,106,0.2); border-radius: var(--r); padding: 20px 24px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.confirmed-emoji { font-size: 38px; }
.confirmed-info { flex: 1; min-width: 140px; }
.confirmed-title { font-family: var(--fh); font-size: 22px; color: var(--green); letter-spacing: 1.5px; }
.confirmed-sub { font-family: var(--fm); font-size: 11px; color: var(--muted2); margin-top: 3px; }
.btn-open { font-family: var(--fm); font-size: 11px; background: var(--green); color: #000; border: none; padding: 9px 18px; border-radius: 5px; cursor: pointer; font-weight: 600; letter-spacing: 1px; white-space: nowrap; }
.btn-open:hover { opacity: 0.85; }

/* ── DEST GRID ── */
.dest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; max-width: var(--max); margin: 0 auto; padding: 0 20px; }
.dest-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px 20px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
.dest-card:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.4); border-color: var(--border2); }
.dest-card.glow { border-color: rgba(127,255,106,0.3); box-shadow: 0 0 24px rgba(127,255,106,0.07); }
.dest-card.glow:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(127,255,106,0.1); }
.card-emoji { font-size: 34px; margin-bottom: 12px; display: block; }
.card-name { font-family: var(--fh); font-size: 28px; letter-spacing: 1.5px; color: var(--text); line-height: 1; margin-bottom: 5px; }
.card-sub { font-size: 12px; color: var(--muted2); margin-bottom: 14px; font-weight: 300; line-height: 1.5; }
.stat-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.stat { font-family: var(--fm); font-size: 10px; background: var(--s2); border: 1px solid var(--border2); border-radius: 4px; padding: 3px 9px; color: var(--muted2); }
.tag-row { display: flex; gap: 5px; flex-wrap: wrap; }
.tag { font-family: var(--fm); font-size: 9px; padding: 3px 8px; border-radius: 20px; letter-spacing: 0.5px; background: rgba(90,99,88,0.2); color: var(--muted2); border: 1px solid var(--border2); }
.tag.confirmed { background: rgba(127,255,106,0.1); color: var(--green); border-color: rgba(127,255,106,0.25); }

.add-dest-card { background: transparent; border: 1.5px dashed var(--border2); border-radius: var(--r); padding: 22px; cursor: pointer; display: none; align-items: center; justify-content: center; min-height: 130px; font-family: var(--fm); font-size: 12px; color: var(--muted); gap: 8px; transition: border-color 0.15s, color 0.15s; }
body.edit-mode .add-dest-card { display: flex; }
.add-dest-card:hover { border-color: var(--muted2); color: var(--muted2); }

/* ── EMPTY STATE ── */
.empty { max-width: var(--max); margin: 64px auto; padding: 0 20px; text-align: center; }
.empty-icon { font-size: 52px; margin-bottom: 16px; }
.empty-title { font-family: var(--fh); font-size: 26px; letter-spacing: 2px; color: var(--muted2); margin-bottom: 8px; }
.empty-sub { font-family: var(--fm); font-size: 11px; color: var(--muted); }

/* ── SKELETON ── */
@keyframes shimmer { from { background-position: -600px 0; } to { background-position: 600px 0; } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.22s ease both; }
.skeleton { background: linear-gradient(90deg, var(--surface) 25%, var(--s2) 50%, var(--surface) 75%); background-size: 600px 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: 4px; }
.skel-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.skel-line { height: 12px; border-radius: 3px; }

/* ════════════════════════════════════════
   DESTINATION DETAIL
════════════════════════════════════════ */

/* ── HERO ── */
.dest-hero { padding: 32px 20px 24px; max-width: var(--max); margin: 0 auto; }
.dest-hero-emoji { font-size: 48px; display: block; margin-bottom: 10px; }
.dest-hero h1 { font-family: var(--fh); font-size: clamp(34px, 7vw, 56px); letter-spacing: 2px; line-height: 1; margin-bottom: 6px; }
.dest-hero-sub { font-size: 13px; color: var(--muted2); margin-bottom: 14px; font-weight: 300; }
.dest-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.dest-stat { background: var(--s2); border: 1px solid var(--border2); border-radius: 6px; padding: 8px 14px; display: flex; flex-direction: column; gap: 2px; }
.dest-stat-label { font-family: var(--fm); font-size: 9px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
.dest-stat-value { font-family: var(--fm); font-size: 13px; color: var(--text); font-weight: 500; }
.dest-hero-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 14px; }
.hero-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.map-link { font-family: var(--fm); font-size: 10px; color: var(--blue); text-decoration: none; border: 1px solid rgba(94,200,255,0.25); background: rgba(94,200,255,0.06); padding: 6px 13px; border-radius: 5px; transition: background 0.15s; letter-spacing: 0.5px; }
.map-link:hover { background: rgba(94,200,255,0.12); }
.density-btn { font-family: var(--fm); font-size: 10px; background: none; border: 1px solid var(--border2); color: var(--muted2); padding: 6px 12px; border-radius: 5px; cursor: pointer; transition: all 0.15s; }
.density-btn:hover { border-color: var(--muted2); color: var(--text); }

/* ── TRIP OVERVIEW (notes) ── */
.trip-overview { max-width: var(--max); margin: 0 auto 4px; padding: 0 20px; }
.overview-card { background: rgba(94,200,255,0.04); border: 1px solid rgba(94,200,255,0.12); border-radius: var(--r); padding: 18px 20px; }
.overview-label { font-family: var(--fm); font-size: 9px; color: var(--blue); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
.overview-lines { display: flex; flex-direction: column; gap: 6px; }
.overview-line { font-size: 13px; color: var(--muted2); line-height: 1.5; }
.overview-line.key-val { display: flex; gap: 8px; }
.overview-key { font-family: var(--fm); font-size: 11px; color: var(--blue); white-space: nowrap; flex-shrink: 0; }
.overview-val { font-size: 13px; color: var(--text); }

/* ── PROGRESS ── */
.progress-wrap { max-width: var(--max); margin: 16px auto 0; padding: 0 20px; }
.progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
.progress-label { font-family: var(--fm); font-size: 10px; color: var(--muted); letter-spacing: 1px; }
.progress-count { font-family: var(--fm); font-size: 11px; color: var(--green); }
.progress-track { height: 4px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.3s ease; }

/* ── SECTION TABS ── */
.section-nav { max-width: var(--max); margin: 20px auto 0; padding: 0 20px; border-bottom: 1px solid var(--border); display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
.section-nav::-webkit-scrollbar { display: none; }
.sec-tab { font-family: var(--fm); font-size: 11px; letter-spacing: 0.5px; padding: 10px 18px; cursor: pointer; white-space: nowrap; background: transparent; border: none; color: var(--muted); transition: all 0.15s; border-bottom: 2px solid transparent; margin-bottom: -1px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
.sec-tab:hover { color: var(--muted2); }
.sec-tab.active { color: var(--green); border-bottom-color: var(--green); }
.sec-tab-count { font-size: 9px; background: var(--s2); border-radius: 10px; padding: 1px 6px; }
.sec-tab.active .sec-tab-count { background: rgba(127,255,106,0.15); color: var(--green); }
.sec-tab-edit { display: none; gap: 2px; margin-left: 4px; }
body.edit-mode .sec-tab-edit { display: flex; }
.tab-edit-btn { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px; border-radius: 3px; line-height: 1; }
.tab-edit-btn:hover { color: var(--text); }

/* ── SECTION CONTENT ── */
.section-content { max-width: var(--max); margin: 0 auto; padding: 20px 20px 0; }

/* ── ROUTE TIMELINE ── */
.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-item { display: flex; gap: 16px; position: relative; }
.tl-item:not(:last-child)::after { content: ''; position: absolute; left: 11px; top: 26px; bottom: -8px; width: 2px; background: var(--border2); }
.tl-left { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; padding-top: 6px; }
.tl-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border2); background: var(--s2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
.tl-dot.green { background: rgba(127,255,106,0.15); border-color: var(--green); }
.tl-dot.amber { background: rgba(245,200,66,0.15); border-color: var(--amber); }
.tl-dot.red   { background: rgba(255,94,94,0.15);  border-color: var(--red); }
.tl-dot.blue  { background: rgba(94,200,255,0.15); border-color: var(--blue); }
.tl-dot-inner { width: 8px; height: 8px; border-radius: 50%; }
.tl-dot.green .tl-dot-inner { background: var(--green); }
.tl-dot.amber .tl-dot-inner { background: var(--amber); }
.tl-dot.red   .tl-dot-inner { background: var(--red); }
.tl-dot.blue  .tl-dot-inner { background: var(--blue); }
.tl-dot.empty .tl-dot-inner { background: var(--muted); }
.tl-body { padding: 4px 0 20px; flex: 1; min-width: 0; }
.tl-name { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
.tl-note { font-family: var(--fm); font-size: 11px; color: var(--muted2); line-height: 1.5; margin-bottom: 4px; }
.tl-tag { display: inline-block; font-family: var(--fm); font-size: 9px; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.5px; text-transform: uppercase; }
.tl-tag.green { background: rgba(127,255,106,0.1); color: var(--green); border: 1px solid rgba(127,255,106,0.2); }
.tl-tag.amber { background: rgba(245,200,66,0.1);  color: var(--amber); border: 1px solid rgba(245,200,66,0.2); }
.tl-tag.red   { background: rgba(255,94,94,0.1);   color: var(--red);   border: 1px solid rgba(255,94,94,0.2); }
.tl-tag.blue  { background: rgba(94,200,255,0.1);  color: var(--blue);  border: 1px solid rgba(94,200,255,0.2); }

/* ── CHECKLIST ITEMS ── */
.bulk-bar { display: flex; gap: 8px; margin-bottom: 14px; }
.bulk-btn { font-family: var(--fm); font-size: 10px; background: none; border: 1px solid var(--border2); color: var(--muted2); padding: 5px 12px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
.bulk-btn:hover { border-color: var(--green); color: var(--green); }

.check-list { display: flex; flex-direction: column; gap: 2px; }
.check-item { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; border-radius: 8px; transition: background 0.1s; cursor: default; }
body.compact-mode .check-item { padding: 6px 12px; }
.check-item:hover { background: rgba(255,255,255,0.025); }
.check-item.is-done .ci-text { color: var(--muted); text-decoration: line-through; }
.check-item.is-never { background: rgba(255,94,94,0.04); border-radius: 8px; }

.ci-check { width: 20px; height: 20px; border: 1.5px solid var(--border2); border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; transition: all 0.15s; background: transparent; }
.ci-check.done { background: var(--green); border-color: var(--green); }
.ci-check.done::after { content: ''; width: 5px; height: 9px; border: 2px solid #000; border-left: none; border-top: none; transform: rotate(45deg) translateY(-1px); }
.ci-never { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; color: var(--red); font-size: 14px; font-weight: bold; }
.ci-info { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; color: var(--blue); font-size: 14px; }

.ci-body { flex: 1; min-width: 0; }
.ci-text { font-size: 13.5px; color: var(--text); line-height: 1.4; }
body.compact-mode .ci-text { font-size: 12.5px; }
.check-item.is-never .ci-text { color: var(--red); }
.ci-note { font-family: var(--fm); font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
.ci-tag { display: inline-block; font-family: var(--fm); font-size: 9px; padding: 2px 7px; border-radius: 3px; margin-left: 7px; vertical-align: middle; text-transform: uppercase; letter-spacing: 0.4px; }
.ci-tag.red   { background: rgba(255,94,94,0.1);   color: var(--red);   border: 1px solid rgba(255,94,94,0.2); }
.ci-tag.amber { background: rgba(245,200,66,0.1);  color: var(--amber); border: 1px solid rgba(245,200,66,0.2); }
.ci-tag.green { background: rgba(127,255,106,0.1); color: var(--green); border: 1px solid rgba(127,255,106,0.2); }
.ci-tag.blue  { background: rgba(94,200,255,0.1);  color: var(--blue);  border: 1px solid rgba(94,200,255,0.2); }

.ci-edit-btns { display: none; gap: 3px; flex-shrink: 0; margin-top: 1px; }
body.edit-mode .ci-edit-btns { display: flex; }

/* drag handles */
.drag-handle { display: none; cursor: grab; color: var(--muted); font-size: 13px; flex-shrink: 0; margin-top: 3px; }
body.edit-mode .drag-handle { display: flex; align-items: center; }

/* add buttons */
.add-item-btn { display: none; font-family: var(--fm); font-size: 11px; background: none; border: 1px dashed var(--border2); border-radius: 7px; color: var(--midden); padding: 9px 14px; cursor: pointer; margin-top: 10px; width: 100%; text-align: left; color: var(--muted); transition: all 0.15s; }
body.edit-mode .add-item-btn { display: block; }
.add-item-btn:hover { border-color: var(--muted2); color: var(--muted2); }
.add-section-btn { display: none; font-family: var(--fm); font-size: 11px; background: none; border: 1.5px dashed var(--border2); border-radius: 7px; color: var(--muted); padding: 10px 16px; cursor: pointer; transition: all 0.15s; }
body.edit-mode .add-section-btn { display: flex; align-items: center; gap: 6px; }
.add-section-btn:hover { border-color: var(--muted2); color: var(--muted2); }

/* drag-over states */
.tl-item.drag-over-item, .check-item.drag-over-item { outline: 2px solid var(--green); border-radius: 8px; }

/* ── CONFIRM FOOTER ── */
.confirm-footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 20px; background: rgba(10,12,11,0.94); backdrop-filter: blur(12px); border-top: 1px solid var(--border); z-index: 90; }
.confirm-btn { width: 100%; max-width: 500px; display: block; margin: 0 auto; background: var(--green); color: #000; border: none; border-radius: 7px; padding: 14px 20px; font-family: var(--fh); font-size: 18px; letter-spacing: 2px; cursor: pointer; transition: opacity 0.15s; }
.confirm-btn:hover { opacity: 0.85; }
.confirmed-row { display: flex; align-items: center; max-width: 500px; margin: 0 auto; gap: 10px; }
.confirmed-label { font-family: var(--fh); font-size: 18px; letter-spacing: 2px; color: var(--muted); flex: 1; text-align: center; }
.unconfirm-btn { flex-shrink: 0; background: none; border: 1px solid var(--border2); color: var(--muted2); font-family: var(--fm); font-size: 11px; padding: 9px 14px; border-radius: 6px; cursor: pointer; letter-spacing: 0.5px; transition: border-color 0.15s, color 0.15s; white-space: nowrap; }
.unconfirm-btn:hover { border-color: var(--red); color: var(--red); }

/* ── MODALS ── */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(5px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 24px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
.modal h3 { font-family: var(--fh); font-size: 22px; letter-spacing: 1px; margin-bottom: 18px; color: var(--text); }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-family: var(--fm); font-size: 10px; color: var(--muted2); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
.form-group input, .form-group textarea, .form-group select { width: 100%; background: var(--s2); border: 1px solid var(--border2); border-radius: 6px; color: var(--text); font-family: var(--fb); font-size: 14px; padding: 9px 11px; outline: none; transition: border-color 0.15s; appearance: none; }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--green); }
.form-group input.error { border-color: var(--red); }
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group select option { background: var(--surface); }
.modal-btns { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
.btn-cancel { background: none; border: 1px solid var(--border2); color: var(--muted2); font-family: var(--fm); font-size: 12px; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
.btn-cancel:hover { border-color: var(--muted2); }
.btn-save { background: var(--green); border: none; color: #000; font-family: var(--fm); font-size: 12px; font-weight: 600; padding: 8px 18px; border-radius: 5px; cursor: pointer; }
.btn-save:hover { opacity: 0.85; }
.btn-danger { background: none; border: 1px solid rgba(255,94,94,0.4); color: var(--red); font-family: var(--fm); font-size: 12px; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
.btn-danger:hover { background: rgba(255,94,94,0.1); }

/* ── TOAST ── */
@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
#toast-container { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { font-family: var(--fm); font-size: 12px; padding: 9px 18px; border-radius: 6px; animation: slideUp 0.2s ease both; white-space: nowrap; }
.toast.success { background: rgba(127,255,106,0.12); border: 1px solid rgba(127,255,106,0.25); color: var(--green); }
.toast.error   { background: rgba(255,94,94,0.12);  border: 1px solid rgba(255,94,94,0.25);  color: var(--red); }
.toast.info    { background: rgba(94,200,255,0.1);  border: 1px solid rgba(94,200,255,0.2);  color: var(--blue); }

/* ── SCROLL TOP ── */
.scroll-top-btn { position: fixed; bottom: 76px; right: 18px; z-index: 80; background: var(--surface); border: 1px solid var(--border2); color: var(--muted2); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s, color 0.15s; opacity: 0; pointer-events: none; }
.scroll-top-btn.visible { opacity: 1; pointer-events: auto; }
.scroll-top-btn:hover { color: var(--text); border-color: var(--muted2); }

/* ── PRINT ── */
@media print {
  #topbar, .confirm-footer, .ci-edit-btns, .add-item-btn, .add-section-btn,
  #toast-container, .scroll-top-btn, .session-banner, .controls,
  .bulk-bar, .drag-handle, .hero-actions .density-btn, .sec-tab-edit { display: none !important; }
  body { background: #fff; color: #000; }
  .dest-hero h1, .card-name { color: #000; }
  #app { padding: 0; }
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<div id="topbar">
  <div id="topbar-left"></div>
  <div class="topbar-right">
    <div id="topbar-dest-btns" style="display:none; gap:6px; align-items:center;"></div>
    <button class="edit-badge" id="edit-badge" onclick="handleEditBadge()">🔒 EDIT</button>
  </div>
</div>

<div id="session-banner" class="session-banner hidden">
  <span id="session-banner-msg">Session expiring soon</span>
  <button onclick="extendSession()">KEEP ME IN</button>
</div>

<div id="app"></div>
<button class="scroll-top-btn" id="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top">↑</button>
<div id="toast-container"></div>

<script>
// ===================== STATE =====================
let token      = localStorage.getItem('auth_token') || null;
let userRole   = localStorage.getItem('user_role')  || null;
let editMode   = false;
let currentView   = 'home';
let currentDestId = null;
let currentDest   = null;
let destinations  = [];
let checkState    = JSON.parse(localStorage.getItem('check_state') || '{}');
let deviceId      = localStorage.getItem('device_id');
if (!deviceId) { deviceId = crypto.randomUUID(); localStorage.setItem('device_id', deviceId); }
let searchQuery  = '';
let filterTag    = '';
let sortBy       = 'default';
let densityMode  = localStorage.getItem('density_mode') || 'comfortable';
let activeSectionId = null;
let pollTimer    = null;
let sessionTimer = null, sessionWarnTimer = null;
const SESSION_MS = 30 * 60 * 1000;
const WARN_MS    = 25 * 60 * 1000;

if (densityMode === 'compact') document.body.classList.add('compact-mode');
window.addEventListener('scroll', () => {
  const btn = document.getElementById('scroll-top-btn');
  if (btn) btn.classList.toggle('visible', window.scrollY > 300);
});

// ===================== API =====================
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res  = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ===================== AUTH =====================
async function checkAuth() {
  if (!token) return;
  try {
    const r = await api('GET', '/api/auth/check');
    if (!r.authenticated) clearSession();
    else { userRole = r.role; localStorage.setItem('user_role', userRole); applyRoleBadge(); }
  } catch { clearSession(); }
}
async function login(password) {
  const data = await api('POST', '/api/auth/login', { password });
  token = data.token; userRole = data.role;
  localStorage.setItem('auth_token', token);
  localStorage.setItem('user_role', userRole);
  startSessionTimer(); applyRoleBadge();
}
async function logout() {
  try { await api('POST', '/api/auth/logout'); } catch {}
  clearSession();
}
function clearSession() {
  token = null; userRole = null; editMode = false;
  localStorage.removeItem('auth_token'); localStorage.removeItem('user_role');
  document.body.classList.remove('edit-mode', 'viewer-mode');
  clearTimeout(sessionTimer); clearTimeout(sessionWarnTimer);
  document.getElementById('session-banner').classList.add('hidden');
  updateEditBadge();
}
function applyRoleBadge() {
  if (userRole === 'viewer') document.body.classList.add('viewer-mode');
  else document.body.classList.remove('viewer-mode');
}
function startSessionTimer() {
  clearTimeout(sessionTimer); clearTimeout(sessionWarnTimer);
  sessionWarnTimer = setTimeout(() => {
    document.getElementById('session-banner-msg').textContent = 'Session expires in 5 min — save anything you need';
    document.getElementById('session-banner').classList.remove('hidden');
  }, WARN_MS);
  sessionTimer = setTimeout(async () => {
    await logout(); render(); toast('Session expired — logged out', 'info');
  }, SESSION_MS);
}
function extendSession() {
  if (!token) return;
  startSessionTimer();
  document.getElementById('session-banner').classList.add('hidden');
  toast('Session extended', 'success');
}
function updateEditBadge() {
  const b = document.getElementById('edit-badge');
  if (!b) return;
  if (editMode) b.textContent = '✏️ EDITING';
  else if (userRole === 'viewer') b.textContent = '👁 VIEW';
  else b.textContent = '🔒 EDIT';
}
async function handleEditBadge() {
  if (editMode || userRole === 'viewer') { await logout(); render(); return; }
  if (token && userRole === 'admin') { editMode = true; document.body.classList.add('edit-mode'); updateEditBadge(); render(); return; }
  showPasswordModal((role) => {
    if (role === 'admin') { editMode = true; document.body.classList.add('edit-mode'); }
    updateEditBadge(); render();
  });
}

// ===================== TOAST =====================
function toast(msg, type = 'success') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  c.appendChild(el); setTimeout(() => el.remove(), 2800);
}

// ===================== RENDER =====================
function render() { updateEditBadge(); if (currentView === 'home') renderHome(); else renderDestView(); }

// ===================== HOME =====================
async function renderHome() {
  currentView = 'home'; currentDestId = null; currentDest = null; activeSectionId = null;
  stopPoll();
  document.getElementById('topbar-left').innerHTML = `<div class="logo" onclick="goHome()">TRIP <span>PLANNER</span></div>`;
  document.getElementById('topbar-dest-btns').style.display = 'none';

  const app = document.getElementById('app');
  app.innerHTML = `<div class="dest-grid" id="home-skel">${[1,2,3].map(() => `<div class="skel-card"><div class="skeleton skel-line" style="height:28px;width:60%"></div><div class="skeleton skel-line" style="width:40%"></div><div class="skeleton skel-line" style="width:80%"></div></div>`).join('')}</div>`;

  try {
    const params = new URLSearchParams();
    if (searchQuery) params.set('q', searchQuery);
    if (sortBy !== 'default') params.set('sort', sortBy);
    destinations = await api('GET', '/api/destinations' + (params.toString() ? '?' + params : ''));
  } catch (e) {
    app.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">COULD NOT LOAD</div><div class="empty-sub">${esc(e.message)}</div></div>`;
    return;
  }

  const confirmed = destinations.find(d => d.confirmed);
  const allTags = [...new Set(destinations.flatMap(d => d.tags || []))].sort();
  const filtered = filterTag ? destinations.filter(d => (d.tags || []).includes(filterTag)) : destinations;

  let html = `<div class="fade-in">
    <div class="home-hero">
      <div class="eyebrow">Anniversary · July 5th · 2025</div>
      <h1>WHERE ARE WE <span>GOING?</span></h1>
      <div class="sub">KABI &amp; DEVA · PICK THE ADVENTURE</div>
    </div>
    <div class="controls">
      <div class="search-row">
        <input class="search-input" id="search-input" placeholder="Search destinations…" value="${esc(searchQuery)}" oninput="onSearchInput(this.value)" />
        <select class="sort-select" onchange="onSortChange(this.value)">
          <option value="default" ${sortBy==='default'?'selected':''}>Default</option>
          <option value="name"     ${sortBy==='name'?'selected':''}>A–Z</option>
          <option value="distance" ${sortBy==='distance'?'selected':''}>Closest</option>
          <option value="duration" ${sortBy==='duration'?'selected':''}>Shortest</option>
        </select>
      </div>`;
  if (allTags.length) {
    html += `<div class="filter-chips"><span class="filter-label">FILTER</span>
      <span class="chip ${!filterTag?'active':''}" onclick="setFilter('')">ALL</span>`;
    for (const t of allTags) html += `<span class="chip ${filterTag===t?'active':''}" onclick="setFilter('${esc(t)}')">${esc(t)}</span>`;
    html += `</div>`;
  }
  html += `</div>`;

  if (confirmed) {
    html += `<div class="confirmed-banner"><div class="confirmed-inner">
      <div class="confirmed-emoji">${confirmed.emoji || '🏍️'}</div>
      <div class="confirmed-info">
        <div class="confirmed-title">WE'RE GOING TO ${esc(confirmed.name.toUpperCase())} 🏍️❤️</div>
        <div class="confirmed-sub">${esc(confirmed.subtitle || '')} · ${confirmed.distance_km} km · ${esc(confirmed.duration_hrs || '')}</div>
      </div>
      <a class="btn-open" href="/munnar.html" style="text-decoration:none;background:var(--amber);color:#000;">🏍️ OPEN TRIP →</a>
    </div></div>`;
  }

  if (!filtered.length && !searchQuery && !filterTag) {
    html += `<div class="empty"><div class="empty-icon">🗺️</div><div class="empty-title">NO DESTINATIONS</div><div class="empty-sub">Enable edit mode to add your first destination</div></div>`;
  } else if (!filtered.length) {
    html += `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">NO RESULTS</div><div class="empty-sub">Try a different search or filter</div></div>`;
  } else {
    html += `<div class="dest-grid">`;
    for (const d of filtered) html += renderDestCard(d);
    html += `<div class="add-dest-card" onclick="showAddDestModal()">＋ ADD DESTINATION</div></div>`;
  }
  html += `</div>`;
  app.innerHTML = html;

  if (searchQuery) {
    const inp = document.getElementById('search-input');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
}

let searchDebounce = null;
function onSearchInput(v) { clearTimeout(searchDebounce); searchQuery = v; searchDebounce = setTimeout(() => renderHome(), 280); }
function onSortChange(v)  { sortBy = v; renderHome(); }
function setFilter(tag)   { filterTag = tag; renderHome(); }

function renderDestCard(d) {
  const tags = (d.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const confirmed = d.confirmed ? `<span class="tag confirmed">✓ CONFIRMED</span>` : '';
  return `<div class="dest-card ${d.confirmed?'glow':''}"  onclick="${d.name==='Munnar'?"location.href='/munnar.html'":d.name==='Vagamon'?"location.href='/vagamon.html'":'openDest('+d.id+')'}">
    <span class="card-emoji">${d.emoji||'📍'}</span>
    <div class="card-name">${esc(d.name)}</div>
    <div class="card-sub">${esc(d.subtitle||'')}</div>
    <div class="stat-row">
      <span class="stat">📍 ${d.distance_km||'?'} km</span>
      <span class="stat">⏱ ${esc(d.duration_hrs||'?')}</span>
    </div>
    <div class="tag-row">${tags}${confirmed}</div>
  </div>`;
}

// ===================== DEST DETAIL =====================
async function openDest(id) {
  currentView = 'dest'; currentDestId = id; activeSectionId = null;
  document.getElementById('topbar-left').innerHTML = `<button class="back-btn" onclick="goHome()">← ALL DESTINATIONS</button>`;
  document.getElementById('topbar-dest-btns').style.display = 'none';
  document.getElementById('app').innerHTML = `<div class="page" style="padding-top:40px">${[1,2].map(()=>`<div class="skel-card" style="margin-bottom:12px"><div class="skeleton skel-line" style="height:32px;width:55%"></div><div class="skeleton skel-line" style="width:40%"></div></div>`).join('')}</div>`;

  try {
    currentDest = await api('GET', '/api/destinations/' + id);
    await syncChecklistFromServer();
  } catch (e) { toast(e.message, 'error'); return; }

  if (!activeSectionId && currentDest.sections?.length) activeSectionId = currentDest.sections[0].id;
  renderDestView();
  startPoll();
}

async function syncChecklistFromServer() {
  if (!currentDestId) return;
  try {
    const s = await api('GET', `/api/checklist/${currentDestId}?device_id=${deviceId}`);
    Object.assign(checkState, s);
    localStorage.setItem('check_state', JSON.stringify(checkState));
  } catch {}
}

function startPoll() {
  stopPoll();
  pollTimer = setInterval(async () => {
    if (currentView !== 'dest' || !currentDestId) { stopPoll(); return; }
    await syncChecklistFromServer();
    updateProgressBar();
  }, 30000);
}
function stopPoll() { clearInterval(pollTimer); pollTimer = null; }

function renderDestView() {
  const d = currentDest;
  document.getElementById('topbar-left').innerHTML = `<button class="back-btn" onclick="goHome()">← ALL DESTINATIONS</button>`;
  const db = document.getElementById('topbar-dest-btns');
  db.style.display = 'flex';
  db.innerHTML = `
    <button class="density-btn" onclick="toggleDensity()">${densityMode==='compact'?'⊟':'⊞'}</button>
    <button class="icon-btn" title="Print" onclick="window.print()">🖨️</button>
    <button class="icon-btn" title="Share" onclick="shareTrip()">📤</button>
    ${editMode ? `<button class="icon-btn" title="Clone" onclick="cloneDestination()">⎘</button>
    <button class="icon-btn" title="Edit" onclick="showEditDestModal()">✏️</button>
    <button class="icon-btn" title="Delete" onclick="deleteDestination()">🗑</button>` : ''}
  `;

  const allCheckItems = (d.sections||[]).flatMap(s => (s.items||[]).filter(i => i.item_type === 'check'));
  const total = allCheckItems.length;
  const done  = allCheckItems.filter(i => checkState[i.id]).length;
  const pct   = total > 0 ? Math.round((done / total) * 100) : 0;
  const mapQ  = encodeURIComponent((d.name||'') + ' India');

  let html = `<div class="fade-in">
    <div class="dest-hero">
      <span class="dest-hero-emoji">${d.emoji||'📍'}</span>
      <h1>${esc(d.name)}</h1>
      <div class="dest-hero-sub">${esc(d.subtitle||'')}</div>
      <div class="dest-stats">
        <div class="dest-stat"><span class="dest-stat-label">Distance</span><span class="dest-stat-value">${d.distance_km||'?'} km</span></div>
        <div class="dest-stat"><span class="dest-stat-label">Duration</span><span class="dest-stat-value">${esc(d.duration_hrs||'?')}</span></div>
        ${total > 0 ? `<div class="dest-stat"><span class="dest-stat-label">Checklist</span><span class="dest-stat-value">${done} / ${total} done</span></div>` : ''}
      </div>
      <div class="dest-hero-tags">${(d.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="hero-actions">
        <a class="map-link" href="https://maps.google.com/?q=${mapQ}" target="_blank" rel="noopener">🗺 VIEW ON MAP</a>
        <button class="density-btn" onclick="toggleDensity()">${densityMode==='compact'?'⊟ COMPACT':'⊞ COMFORTABLE'}</button>
      </div>
    </div>`;

  // Notes rendered as structured overview
  if (d.notes) html += renderNotes(d.notes);

  // Progress bar
  if (total > 0) {
    html += `<div class="progress-wrap">
      <div class="progress-header">
        <span class="progress-label">CHECKLIST PROGRESS</span>
        <span class="progress-count" id="progress-count">${done} / ${total} · ${pct}%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:${pct}%"></div></div>
    </div>`;
  }

  // Tab bar
  const sections = d.sections || [];
  if (sections.length) {
    html += `<div class="section-nav" id="section-nav">`;
    for (const s of sections) {
      const sCheckItems = (s.items||[]).filter(i => i.item_type === 'check');
      const sDone = sCheckItems.filter(i => checkState[i.id]).length;
      const countLabel = sCheckItems.length > 0 ? `${sDone}/${sCheckItems.length}` : (s.items||[]).length;
      html += `<button class="sec-tab ${s.id === activeSectionId ? 'active' : ''}" onclick="switchTab(${s.id})">
        ${s.icon ? `<span>${s.icon}</span>` : ''}
        <span>${esc(s.title)}</span>
        <span class="sec-tab-count" id="tab-count-${s.id}">${countLabel}</span>
        <span class="sec-tab-edit">
          <button class="tab-edit-btn" onclick="event.stopPropagation();showEditSectionModal(${s.id},'${esc(s.icon||'')}','${esc(s.title)}')" title="Edit section">✏️</button>
          <button class="tab-edit-btn" onclick="event.stopPropagation();deleteSection(${s.id})" title="Delete section">🗑</button>
        </span>
      </button>`;
    }
    if (editMode) html += `<button class="sec-tab" onclick="showAddSectionModal()" style="color:var(--muted)">＋ ADD</button>`;
    html += `</div>`;

    // Active section content
    const activeSection = sections.find(s => s.id === activeSectionId) || sections[0];
    html += `<div class="section-content" id="section-content">${renderSectionContent(activeSection)}</div>`;
  }

  html += `</div>`;

  // Confirm footer
  html += `<div class="confirm-footer">`;
  if (d.confirmed) {
    html += `<div class="confirmed-row"><div class="confirmed-label">✓ THIS IS THE ONE</div><button class="unconfirm-btn" onclick="unconfirmTrip()">↩ UNDO</button></div>`;
  } else {
    html += `<button class="confirm-btn" onclick="confirmTrip()">WE'RE GOING TO ${esc(d.name.toUpperCase())} 🏍️❤️</button>`;
  }
  html += `</div>`;

  document.getElementById('app').innerHTML = html;
  if (editMode) initItemDrag();
}

function renderNotes(notes) {
  const lines = notes.split('\n').filter(l => l.trim());
  const lineHtml = lines.map(line => {
    const colonIdx = line.indexOf(':');
    if (colonIdx > 0 && colonIdx < 20) {
      const key = line.slice(0, colonIdx).trim();
      const val = line.slice(colonIdx + 1).trim();
      if (val) return `<div class="overview-line key-val"><span class="overview-key">${esc(key)}</span><span class="overview-val">${esc(val)}</span></div>`;
    }
    return `<div class="overview-line">${esc(line)}</div>`;
  }).join('');
  return `<div class="trip-overview"><div class="overview-card">
    <div class="overview-label">📋 Trip Overview</div>
    <div class="overview-lines">${lineHtml}</div>
  </div></div>`;
}

function switchTab(id) {
  activeSectionId = id;
  // update tab highlights
  document.querySelectorAll('.sec-tab').forEach(t => t.classList.remove('active'));
  const sections = currentDest?.sections || [];
  const idx = sections.findIndex(s => s.id === id);
  const tabs = document.querySelectorAll('.sec-tab');
  if (tabs[idx]) tabs[idx].classList.add('active');
  // swap content
  const section = sections.find(s => s.id === id);
  const content = document.getElementById('section-content');
  if (content && section) content.innerHTML = renderSectionContent(section);
  if (editMode) initItemDrag();
}

function renderSectionContent(section) {
  const items = section.items || [];
  const isRoute = section.type === 'route' || items.some(i => i.item_type === 'route_stop');
  let html = '';

  if (isRoute) {
    html += `<div class="timeline" id="items-${section.id}">`;
    for (const item of items) html += renderTimelineItem(item);
    html += `</div>`;
  } else {
    const checkItems = items.filter(i => i.item_type === 'check');
    if (checkItems.length > 0) {
      html += `<div class="bulk-bar">
        <button class="bulk-btn" onclick="bulkCheck(${section.id}, true)">✓ Check All</button>
        <button class="bulk-btn" onclick="bulkCheck(${section.id}, false)">○ Uncheck All</button>
      </div>`;
    }
    html += `<div class="check-list" id="items-${section.id}">`;
    for (const item of items) html += renderCheckItem(item);
    html += `</div>`;
  }

  html += `<button class="add-item-btn" onclick="showAddItemModal(${section.id})">＋ Add item</button>`;
  return html;
}

function renderTimelineItem(item) {
  const color = item.tag_color || 'empty';
  const tag = item.tag ? `<span class="tl-tag ${color}">${esc(item.tag)}</span>` : '';
  const note = item.note ? `<div class="tl-note">${esc(item.note)}</div>` : '';
  const editBtns = `<div class="ci-edit-btns">
    <button class="icon-btn" style="font-size:12px" onclick="showEditItemModal(${item.id})">✏️</button>
    <button class="icon-btn" style="font-size:12px" onclick="deleteItem(${item.id})">🗑</button>
  </div>`;
  return `<div class="tl-item" id="item-${item.id}" data-item-id="${item.id}" data-section-id="${item.section_id}">
    <div class="tl-left"><div class="tl-dot ${color}"><div class="tl-dot-inner"></div></div></div>
    <div class="tl-body">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <div><div class="tl-name">${esc(item.text)}</div>${note}${tag}</div>
        ${editBtns}
      </div>
    </div>
  </div>`;
}

function renderCheckItem(item) {
  const isDone = !!checkState[item.id];
  const tag = item.tag ? `<span class="ci-tag ${item.tag_color||'blue'}">${esc(item.tag)}</span>` : '';
  const note = item.note ? `<div class="ci-note">${esc(item.note)}</div>` : '';
  const editBtns = `<div class="ci-edit-btns">
    <button class="icon-btn" style="font-size:12px" onclick="showEditItemModal(${item.id})">✏️</button>
    <button class="icon-btn" style="font-size:12px" onclick="deleteItem(${item.id})">🗑</button>
  </div>`;

  let icon = '';
  let cls  = '';
  if (item.item_type === 'check') {
    icon = `<div class="ci-check ${isDone?'done':''}" onclick="toggleCheck(${item.id},this,event)"></div>`;
    cls  = isDone ? ' is-done' : '';
  } else if (item.item_type === 'never') {
    icon = `<div class="ci-never">✕</div>`;
    cls  = ' is-never';
  } else if (item.item_type === 'info') {
    icon = `<div class="ci-info">ℹ</div>`;
  } else {
    icon = `<div class="ci-info">•</div>`;
  }

  return `<div class="check-item${cls}" id="item-${item.id}" data-item-id="${item.id}" data-section-id="${item.section_id}">
    <span class="drag-handle" onclick="event.stopPropagation()">⠿</span>
    ${icon}
    <div class="ci-body">
      <div class="ci-text">${esc(item.text)}${tag}</div>
      ${note}
    </div>
    ${editBtns}
  </div>`;
}

// ===================== CHECK TOGGLE =====================
function toggleCheck(itemId, el, event) {
  event.stopPropagation();
  const newState = !checkState[itemId];
  checkState[itemId] = newState;
  localStorage.setItem('check_state', JSON.stringify(checkState));
  if (newState) { el.classList.add('done'); el.closest('.check-item')?.classList.add('is-done'); }
  else          { el.classList.remove('done'); el.closest('.check-item')?.classList.remove('is-done'); }
  updateProgressBar();
  updateTabCount(activeSectionId);
  api('PUT', `/api/checklist/${itemId}`, { device_id: deviceId, checked: newState }).catch(() => {});
}

function bulkCheck(sectionId, checked) {
  const section = (currentDest?.sections||[]).find(s => s.id === sectionId);
  if (!section) return;
  for (const item of (section.items||[]).filter(i => i.item_type === 'check')) {
    checkState[item.id] = checked;
    const row = document.getElementById('item-' + item.id);
    const cb  = row?.querySelector('.ci-check');
    if (checked) { cb?.classList.add('done'); row?.classList.add('is-done'); }
    else         { cb?.classList.remove('done'); row?.classList.remove('is-done'); }
    api('PUT', `/api/checklist/${item.id}`, { device_id: deviceId, checked }).catch(() => {});
  }
  localStorage.setItem('check_state', JSON.stringify(checkState));
  updateProgressBar();
  updateTabCount(sectionId);
}

function updateProgressBar() {
  const fill = document.getElementById('progress-fill');
  const count = document.getElementById('progress-count');
  if (!fill || !currentDest) return;
  const all = (currentDest.sections||[]).flatMap(s => (s.items||[]).filter(i => i.item_type === 'check'));
  const total = all.length, done = all.filter(i => checkState[i.id]).length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  fill.style.width = pct + '%';
  if (count) count.textContent = `${done} / ${total} · ${pct}%`;
}

function updateTabCount(sectionId) {
  const el = document.getElementById('tab-count-' + sectionId);
  if (!el) return;
  const section = (currentDest?.sections||[]).find(s => s.id === sectionId);
  if (!section) return;
  const checks = (section.items||[]).filter(i => i.item_type === 'check');
  const done = checks.filter(i => checkState[i.id]).length;
  el.textContent = checks.length > 0 ? `${done}/${checks.length}` : (section.items||[]).length;
}

// ===================== DENSITY =====================
function toggleDensity() {
  densityMode = densityMode === 'compact' ? 'comfortable' : 'compact';
  localStorage.setItem('density_mode', densityMode);
  document.body.classList.toggle('compact-mode', densityMode === 'compact');
  document.querySelectorAll('.density-btn').forEach(b => b.textContent = densityMode === 'compact' ? '⊟ COMPACT' : '⊞ COMFORTABLE');
}

// ===================== DRAG REORDER =====================
function initItemDrag() {
  document.querySelectorAll('[id^="items-"]').forEach(container => {
    let dragSrc = null;
    container.querySelectorAll('[data-item-id]').forEach(row => {
      row.setAttribute('draggable', 'true');
      row.addEventListener('dragstart', e => { dragSrc = row; e.dataTransfer.effectAllowed = 'move'; e.stopPropagation(); });
      row.addEventListener('dragend', () => { container.querySelectorAll('[data-item-id]').forEach(r => r.classList.remove('drag-over-item')); dragSrc = null; });
      row.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
      row.addEventListener('dragenter', e => { e.preventDefault(); e.stopPropagation(); if (row !== dragSrc) row.classList.add('drag-over-item'); });
      row.addEventListener('dragleave', () => row.classList.remove('drag-over-item'));
      row.addEventListener('drop', async e => {
        e.preventDefault(); e.stopPropagation();
        if (!dragSrc || dragSrc === row) { row.classList.remove('drag-over-item'); return; }
        const rows = [...container.querySelectorAll('[data-item-id]')];
        const si = rows.indexOf(dragSrc), ti = rows.indexOf(row);
        if (si < ti) container.insertBefore(dragSrc, row.nextSibling);
        else container.insertBefore(dragSrc, row);
        row.classList.remove('drag-over-item');
        const sectionId = parseInt(row.dataset.sectionId);
        const newOrder = [...container.querySelectorAll('[data-item-id]')].map((r,i) => ({ id: parseInt(r.dataset.itemId), sort_order: i }));
        try {
          await api('POST', `/api/sections/${sectionId}/items/reorder`, newOrder);
          const sec = (currentDest.sections||[]).find(s => s.id === sectionId);
          if (sec) { const map = Object.fromEntries((sec.items||[]).map(it => [it.id, it])); sec.items = newOrder.map(o => map[o.id]).filter(Boolean); }
          toast('Reordered');
        } catch (err) { toast(err.message, 'error'); }
      });
    });
  });
}

// ===================== NAVIGATION =====================
async function goHome() { stopPoll(); currentView = 'home'; currentDestId = null; currentDest = null; renderHome(); }

// ===================== CONFIRM =====================
async function unconfirmTrip() {
  if (!token) { showPasswordModal(async () => { editMode=true; document.body.classList.add('edit-mode'); updateEditBadge(); await doUnconfirm(); }); return; }
  await doUnconfirm();
}
async function doUnconfirm() {
  if (!confirm('Remove confirmation?')) return;
  try { await api('PUT', '/api/destinations/' + currentDest.id, { confirmed: false }); currentDest = await api('GET', '/api/destinations/' + currentDest.id); toast('Confirmation removed'); renderDestView(); } catch (e) { toast(e.message, 'error'); }
}
async function confirmTrip() {
  if (!token) { showPasswordModal(async () => { editMode=true; document.body.classList.add('edit-mode'); updateEditBadge(); await doConfirm(); }); return; }
  await doConfirm();
}
async function doConfirm() {
  if (!confirm(`Set "${currentDest.name}" as THE destination?`)) return;
  try { await api('PUT', '/api/destinations/' + currentDest.id, { confirmed: true }); currentDest = await api('GET', '/api/destinations/' + currentDest.id); toast('Trip confirmed! 🏍️❤️'); renderDestView(); } catch (e) { toast(e.message, 'error'); }
}

// ===================== CRUD =====================
async function deleteDestination() {
  if (!confirm('Delete this destination?')) return;
  try { await api('DELETE', '/api/destinations/' + currentDestId); toast('Deleted'); goHome(); } catch (e) { toast(e.message, 'error'); }
}
async function cloneDestination() {
  try { const n = await api('POST', `/api/destinations/${currentDestId}/clone`); toast('Cloned'); openDest(n.id); } catch (e) { toast(e.message, 'error'); }
}
async function deleteSection(id) {
  if (!confirm('Delete this section and all items?')) return;
  try {
    await api('DELETE', '/api/sections/' + id);
    currentDest.sections = currentDest.sections.filter(s => s.id !== id);
    activeSectionId = currentDest.sections[0]?.id || null;
    renderDestView(); toast('Section deleted');
  } catch (e) { toast(e.message, 'error'); }
}
async function deleteItem(id) {
  if (!confirm('Delete this item?')) return;
  try {
    await api('DELETE', '/api/items/' + id);
    for (const s of currentDest.sections) s.items = s.items.filter(i => i.id !== id);
    const section = (currentDest.sections||[]).find(s => s.id === activeSectionId);
    if (section) document.getElementById('section-content').innerHTML = renderSectionContent(section);
    if (editMode) initItemDrag();
    updateProgressBar(); updateTabCount(activeSectionId);
    toast('Item deleted');
  } catch (e) { toast(e.message, 'error'); }
}

// ===================== SHARE =====================
async function shareTrip() {
  if (!currentDest) return;
  const d = currentDest;
  const lines = [`🏍️ ${d.name} — ${d.subtitle||''}`, `📍 ${d.distance_km}km · ⏱ ${d.duration_hrs}`, ''];
  for (const s of d.sections||[]) {
    lines.push(`— ${s.title.toUpperCase()} —`);
    for (const item of s.items||[]) {
      const p = item.item_type === 'check' ? (checkState[item.id]?'✓':'○') : item.item_type === 'never' ? '✕' : '•';
      lines.push(`  ${p} ${item.text}${item.note ? ` (${item.note})` : ''}`);
    }
    lines.push('');
  }
  const text = lines.join('\n');
  if (navigator.share) { try { await navigator.share({ title: `Trip to ${d.name}`, text }); return; } catch {} }
  try { await navigator.clipboard.writeText(text); toast('Copied to clipboard!'); }
  catch { toast('Could not copy', 'error'); }
}

// ===================== MODALS =====================
function showModal(html) {
  closeModal();
  const b = document.createElement('div');
  b.className = 'modal-backdrop'; b.id = 'modal-backdrop';
  b.innerHTML = `<div class="modal">${html}</div>`;
  b.addEventListener('click', e => { if (e.target === b) closeModal(); });
  document.body.appendChild(b);
}
function closeModal() { document.getElementById('modal-backdrop')?.remove(); }

function showPasswordModal(onSuccess) {
  showModal(`<h3>ENTER PASSWORD</h3>
    <div class="form-group"><label>Password</label><input type="password" id="pw-input" placeholder="Admin or viewer password" autocomplete="current-password" /></div>
    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" onclick="submitPassword()">Unlock</button></div>`);
  const inp = document.getElementById('pw-input');
  inp.focus();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') submitPassword(); });
  window._pwCallback = onSuccess;
}
async function submitPassword() {
  const inp = document.getElementById('pw-input');
  try {
    await login(inp.value); closeModal();
    if (window._pwCallback) { window._pwCallback(userRole); window._pwCallback = null; }
  } catch { inp.classList.add('error'); inp.value = ''; inp.focus(); setTimeout(() => inp.classList.remove('error'), 1000); }
}

function showAddDestModal()  { showDestModal(null); }
function showEditDestModal() { showDestModal(currentDest); }
function showDestModal(dest) {
  const isEdit = !!dest;
  showModal(`<h3>${isEdit?'EDIT':'ADD'} DESTINATION</h3>
    <div class="form-group"><label>Emoji</label><input id="d-emoji" value="${dest?esc(dest.emoji||''):''}" placeholder="🏔️" /></div>
    <div class="form-group"><label>Name</label><input id="d-name" value="${dest?esc(dest.name):''}" placeholder="Vagamon" /></div>
    <div class="form-group"><label>Subtitle</label><input id="d-sub" value="${dest?esc(dest.subtitle||''):''}" placeholder="Ghats · Monsoon" /></div>
    <div class="form-group"><label>Distance (km)</label><input id="d-km" type="number" value="${dest?dest.distance_km:''}" /></div>
    <div class="form-group"><label>Duration</label><input id="d-dur" value="${dest?esc(dest.duration_hrs||''):''}" placeholder="6–7 hrs" /></div>
    <div class="form-group"><label>Tags (comma separated)</label><input id="d-tags" value="${dest?esc((dest.tags||[]).join(', ')):''}" /></div>
    <div class="form-group"><label>Notes</label><textarea id="d-notes" placeholder="Free-form notes…">${dest&&dest.notes?esc(dest.notes):''}</textarea></div>
    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" onclick="saveDestModal(${isEdit?dest.id:'null'})">Save</button></div>`);
}
async function saveDestModal(editId) {
  const payload = {
    emoji: document.getElementById('d-emoji').value.trim(),
    name:  document.getElementById('d-name').value.trim(),
    subtitle: document.getElementById('d-sub').value.trim(),
    distance_km: parseInt(document.getElementById('d-km').value)||0,
    duration_hrs: document.getElementById('d-dur').value.trim(),
    tags: document.getElementById('d-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
    notes: document.getElementById('d-notes').value.trim()||null,
  };
  if (!payload.name) { toast('Name required', 'error'); return; }
  try {
    if (editId) { await api('PUT', '/api/destinations/'+editId, payload); currentDest = await api('GET', '/api/destinations/'+editId); toast('Updated'); closeModal(); renderDestView(); }
    else { const d = await api('POST', '/api/destinations', payload); toast('Added'); closeModal(); openDest(d.id); }
  } catch (e) { toast(e.message, 'error'); }
}

function showAddSectionModal() { showSectionModal(null, null, null); }
function showEditSectionModal(id, icon, title) { showSectionModal(id, icon, title); }
function showSectionModal(id, icon, title) {
  const isEdit = !!id;
  showModal(`<h3>${isEdit?'EDIT':'ADD'} SECTION</h3>
    <div class="form-group"><label>Icon</label><input id="s-icon" value="${icon?esc(icon):''}" placeholder="🛣️" /></div>
    <div class="form-group"><label>Title</label><input id="s-title" value="${title?esc(title):''}" placeholder="Route + Speed Zones" /></div>
    ${!isEdit?`<div class="form-group"><label>Type</label><select id="s-type"><option value="checklist">Checklist</option><option value="route">Route</option><option value="hotels">Hotels</option><option value="activities">Activities</option><option value="custom">Custom</option></select></div>`:''}
    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" onclick="saveSectionModal(${id||'null'})">Save</button></div>`);
}
async function saveSectionModal(editId) {
  const icon = document.getElementById('s-icon').value.trim();
  const title = document.getElementById('s-title').value.trim();
  if (!title) { toast('Title required', 'error'); return; }
  try {
    if (editId) {
      await api('PUT', '/api/sections/'+editId, { icon, title });
      const s = currentDest.sections.find(s => s.id === editId);
      if (s) { s.icon = icon; s.title = title; }
      toast('Updated'); closeModal(); renderDestView();
    } else {
      const typeEl = document.getElementById('s-type');
      const s = await api('POST', `/api/destinations/${currentDestId}/sections`, { icon, title, type: typeEl?.value||'custom' });
      currentDest.sections.push({ ...s, items: [] });
      activeSectionId = s.id;
      toast('Section added'); closeModal(); renderDestView();
    }
  } catch (e) { toast(e.message, 'error'); }
}

function showAddItemModal(sectionId) { showItemModal(null, sectionId); }
async function showEditItemModal(itemId) {
  let item = null;
  for (const s of currentDest.sections) { item = s.items.find(i => i.id === itemId); if (item) break; }
  if (!item) return;
  showItemModal(item, item.section_id);
}
function showItemModal(item, sectionId) {
  const isEdit = !!item;
  showModal(`<h3>${isEdit?'EDIT':'ADD'} ITEM</h3>
    <div class="form-group"><label>Type</label><select id="i-type">
      <option value="check"      ${item?.item_type==='check'?'selected':''}>Check</option>
      <option value="never"      ${item?.item_type==='never'?'selected':''}>Never</option>
      <option value="route_stop" ${item?.item_type==='route_stop'?'selected':''}>Route Stop</option>
      <option value="info"       ${item?.item_type==='info'?'selected':''}>Info</option>
    </select></div>
    <div class="form-group"><label>Text</label><input id="i-text" value="${item?esc(item.text):''}" placeholder="Item text" /></div>
    <div class="form-group"><label>Note (optional)</label><textarea id="i-note">${item?.note?esc(item.note):''}</textarea></div>
    <div class="form-group"><label>Tag label</label><input id="i-tag" value="${item?.tag?esc(item.tag):''}" placeholder="critical" /></div>
    <div class="form-group"><label>Tag color</label><select id="i-color">
      <option value=""      ${!item?.tag_color?'selected':''}>None</option>
      <option value="red"   ${item?.tag_color==='red'?'selected':''}>Red</option>
      <option value="amber" ${item?.tag_color==='amber'?'selected':''}>Amber</option>
      <option value="green" ${item?.tag_color==='green'?'selected':''}>Green</option>
      <option value="blue"  ${item?.tag_color==='blue'?'selected':''}>Blue</option>
    </select></div>
    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" onclick="saveItemModal(${isEdit?item.id:'null'},${sectionId})">Save</button></div>`);
  document.getElementById('i-text').focus();
}
async function saveItemModal(editId, sectionId) {
  const payload = {
    item_type: document.getElementById('i-type').value,
    text:      document.getElementById('i-text').value.trim(),
    note:      document.getElementById('i-note').value.trim()||null,
    tag:       document.getElementById('i-tag').value.trim()||null,
    tag_color: document.getElementById('i-color').value||'',
  };
  if (!payload.text) { toast('Text required', 'error'); return; }
  try {
    if (editId) {
      const updated = await api('PUT', '/api/items/'+editId, payload);
      for (const s of currentDest.sections) { const idx = s.items.findIndex(i => i.id === editId); if (idx !== -1) { s.items[idx] = updated; break; } }
      toast('Updated');
    } else {
      const created = await api('POST', `/api/sections/${sectionId}/items`, payload);
      const s = currentDest.sections.find(s => s.id === sectionId);
      if (s) s.items.push(created);
      toast('Added');
    }
    closeModal();
    const section = (currentDest.sections||[]).find(s => s.id === activeSectionId);
    if (section) document.getElementById('section-content').innerHTML = renderSectionContent(section);
    if (editMode) initItemDrag();
    updateProgressBar(); updateTabCount(activeSectionId);
  } catch (e) { toast(e.message, 'error'); }
}

// ===================== KEYBOARD =====================
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if (document.getElementById('modal-backdrop')) { if (e.key === 'Escape') closeModal(); return; }
  if (e.key === 'Escape' || e.key === 'h' || e.key === 'H') { if (currentView === 'dest') goHome(); }
  if ((e.key === 'e' || e.key === 'E') && token && userRole === 'admin') handleEditBadge();
  if (e.key === '/' && currentView === 'home') { e.preventDefault(); document.getElementById('search-input')?.focus(); }
  if ((e.key === 'p' || e.key === 'P') && currentView === 'dest') window.print();
});

// ===================== UTILS =====================
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
}


// ===================== INIT =====================
(async function init() {
  await checkAuth();
  if (token && userRole === 'admin') startSessionTimer();
  renderHome();
})();
</script>
